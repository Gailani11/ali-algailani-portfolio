<style>
/* Layout: Jawad's own identity (logo red, charcoal, white, blush, Rubik) staged like a premium
   showroom: wide cinematic banners, products on one unified stone tile, red used as a signature. */
:root{
  --bg:#ffffff; --blush:#fff9f9; --stone:#f4f1ef; --stone-2:#ebe6e2;
  --ink:#2c2c2c; --ink-2:#1d1d1d; --mute:#737373; --mute-2:#a3a3a3; --line:#ece6e3;
  --red:#ae1f23; --red-wash:rgba(174,31,35,.08); --red-line:rgba(174,31,35,.35);
  --ok:#2f8f5b;
  --font:'Rubik','Segoe UI',Tahoma,Arial,sans-serif;
  --ease:cubic-bezier(.22,.8,.12,1);
  --r:22px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--ink)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
img{display:block}
:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:8px}
::selection{background:var(--red);color:#fff}
.wrap{max-width:1320px;margin-inline:auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}
[hidden]{display:none!important}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance;font-weight:600}
h2{font-size:clamp(28px,3.6vw,48px);letter-spacing:-.01em}
.kicker{display:inline-flex;align-items:center;gap:10px;color:var(--red);font-weight:500;font-size:14px}
.lead{color:var(--mute);font-size:clamp(15px,1.25vw,18px);max-width:60ch;margin:0}
.sec{padding-block:clamp(64px,8vw,120px)}
.head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:clamp(28px,4vw,48px)}
.head > div:first-child{display:grid;gap:12px;min-width:0}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding-inline:26px;border-radius:999px;font-weight:500;font-size:15px;white-space:nowrap;position:relative;overflow:hidden;isolation:isolate;transition:transform .4s var(--ease),color .35s,border-color .35s,background .35s}
.btn svg{width:18px;height:18px;flex:none;transition:transform .4s var(--ease)}
html[dir=rtl] .btn .ar{transform:scaleX(-1)}
.btn-red{background:var(--red);color:#fff}
.btn-red::before{content:"";position:absolute;inset:0;background:var(--ink);transform:scaleY(0);transform-origin:bottom;transition:transform .5s var(--ease);z-index:-1}
.btn-red:hover::before{transform:scaleY(1)}
.btn-ghost{border:1.5px solid var(--line);background:#fff}
.btn-ghost:hover{border-color:var(--ink)}
.btn-white{background:#fff;color:var(--ink)}
.btn-white:hover{background:var(--red);color:#fff}
.btn-line-w{border:1.5px solid rgba(255,255,255,.5);color:#fff}
.btn-line-w:hover{background:#fff;color:var(--ink);border-color:#fff}
.btn:hover .ar{transform:translateX(4px)}
html[dir=rtl] .btn:hover .ar{transform:scaleX(-1) translateX(4px)}

/* phones and tablets: no live blur and no slow zoom on the banner — both are costly on older iPhones */
@media (hover:none),(max-width:960px){
  header.hd{background:rgba(255,255,255,.97);backdrop-filter:none;-webkit-backdrop-filter:none}
  .glass{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(18,16,16,.58)!important}
  .so{backdrop-filter:none}
}
/* Materials: dark band */
.dark3{background:#1f1b1a;color:rgba(255,255,255,.75);padding-block:clamp(64px,8vw,120px);margin-top:clamp(64px,8vw,120px)}
.dark3 h2{color:#fff}
.mats3{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:14px}
.mat3{display:grid;justify-items:center;gap:14px;padding:22px 8px 20px;border-radius:var(--r);border:1px solid rgba(255,255,255,.12);text-align:center;transition:background .45s,border-color .45s;min-width:0}
.mat3 .disc{position:relative;width:100%;max-width:120px;aspect-ratio:1;border-radius:50%;background:var(--stone);display:grid;place-items:center;overflow:hidden}
.mat3 .disc img{width:70%;height:70%;object-fit:contain;transition:transform .8s var(--ease)}
.mat3 .grid4{display:grid;grid-template-columns:repeat(2,18px);gap:6px}
.mat3 .grid4 span{width:18px;height:18px;border-radius:5px;background:var(--red)}
.mat3 .grid4 span:nth-child(2),.mat3 .grid4 span:nth-child(3){background:var(--ink)}
.mat3 b{color:#fff;font-weight:600;font-size:16px}
.mat3 small{color:rgba(255,255,255,.5);font-size:13px;margin-top:-10px}
@media (hover:hover){.mat3:hover{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.3)} .mat3:hover .disc img{transform:scale(1.12) rotate(-5deg)}}
/* Catalogue CTA with the real cover */
.cta3{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:30px;align-items:center;border-radius:34px;background:var(--red);color:#fff;padding:clamp(34px,5vw,72px);overflow:hidden;isolation:isolate}
.cta3::before{content:"";position:absolute;width:620px;height:620px;border-radius:50%;border:90px solid rgba(255,255,255,.06);inset-inline-end:-200px;top:-260px;z-index:-1}
.cta3 h2{color:#fff}
.cta3 p{color:rgba(255,255,255,.85);max-width:520px;margin:0}
.cta3 .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.cta3 .cover{justify-self:center;position:relative;width:min(300px,100%);perspective:1200px}
.cta3 .cover img{width:100%;border-radius:6px;box-shadow:0 40px 60px -30px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.1);transform:rotateY(-14deg) rotateX(4deg) rotate(2deg);transition:transform 1s var(--ease)}
html[dir=ltr] .cta3 .cover img{transform:rotateY(14deg) rotateX(4deg) rotate(-2deg)}
@media (hover:hover){.cta3:hover .cover img{transform:none}}
.cta3 .cover::after{content:"PDF";position:absolute;top:-14px;inset-inline-end:-14px;background:#fff;color:var(--red);font-weight:700;font-size:13px;padding:8px 12px;border-radius:999px;box-shadow:0 10px 20px -10px rgba(0,0,0,.4)}
@media (max-width:1180px){.mats3{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:960px){.cta3{grid-template-columns:minmax(0,1fr)}.cta3 .cover{width:min(240px,70%)}}
@media (max-width:640px){
  .mats3{gap:8px}.mat3{padding:14px 4px;gap:10px;border-radius:18px}.mat3 b{font-size:13.5px}.mat3 small{display:none}
  .cta3{border-radius:24px;padding:30px 20px}
  .cta3 .row .btn{width:100%;white-space:normal;height:auto;min-height:54px;padding-block:12px;text-align:center}
}
/* Branches (contact page) */
.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--mute);font-size:13.5px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--mute-2)}
.legend i.r{background:var(--red)}
.branches{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(24px,3vw,40px);align-items:start}
.acc{display:grid;gap:10px}
.acc .item{border:1.5px solid var(--line);border-radius:18px;background:#fff;overflow:hidden;transition:border-color .3s,box-shadow .3s}
.acc .item.open{border-color:var(--red);box-shadow:0 18px 36px -28px rgba(0,0,0,.4)}
.acc .trg{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;text-align:start}
.acc .trg .nm{display:grid;min-width:0}
.acc .trg b{font-size:17px;font-weight:600;color:var(--ink);line-height:1.35}
.acc .trg .nm span{font-size:13.5px;color:var(--mute)}
.acc .pm2{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;transition:transform .5s var(--ease),background .3s,color .3s}
.acc .pm2 svg{width:15px;height:15px}
.acc .item.open .pm2{transform:rotate(180deg);background:var(--red);color:#fff;border-color:var(--red)}
.acc .body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s var(--ease)}
.acc .item.open .body{grid-template-rows:1fr}
.acc .body > div{overflow:hidden}
.acc .inner{display:flex;flex-wrap:wrap;gap:8px 18px;padding:0 20px 18px;font-size:14.5px}
.acc .inner a{display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
.acc .inner a svg{width:16px;height:16px;color:var(--red)}
@media (hover:hover){.acc .inner a:hover{color:var(--red)}}
.mapbox{position:sticky;top:110px;border-radius:var(--r);overflow:hidden;background:var(--stone);aspect-ratio:4/3.2;border:1.5px solid var(--line)}
.mapbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mapbox .mcap{position:absolute;z-index:2;inset-inline-start:16px;bottom:16px;background:#fff;border-radius:14px;padding:12px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 14px 30px -18px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
.mapbox .mcap b{display:block;font-weight:600;color:var(--ink);line-height:1.3}
.mapbox .mcap a{font-size:13px;color:var(--red);display:inline-flex;gap:6px;align-items:center}
.mapbox .mcap a svg{width:14px;height:14px}
.mapbox .mcap .dot{width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 0 5px rgba(174,31,35,.18);flex:none}
@media (max-width:960px){.branches{grid-template-columns:minmax(0,1fr)}.mapbox{position:relative;top:0}}
/* Curtain (first load only) */
.curtain{position:fixed;inset:0;z-index:100;pointer-events:none;display:grid;place-items:center;background:var(--ink-2);opacity:0;visibility:hidden}
.curtain img{width:130px;opacity:0}
.curtain.intro{opacity:1;visibility:visible;animation:introOut .7s ease 1.1s forwards}
.curtain.intro img{animation:logoIn .8s var(--ease) .1s forwards}
@keyframes introOut{to{opacity:0;visibility:hidden}}
@keyframes logoIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* Top bar + header */
.topbar{background:var(--ink);color:#d6d6d6;font-size:13px}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:40px;flex-wrap:wrap}
.topbar .g{display:flex;align-items:center;gap:20px}
.topbar .g span{display:inline-flex;align-items:center;gap:7px}
.topbar svg{width:14px;height:14px;color:#fff;opacity:.75}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mute-2)}
.st-open .dot{background:#4ade80;box-shadow:0 0 0 4px rgba(74,222,128,.18)}
.langbtn{border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px 12px;font-size:12.5px;color:#fff;transition:background .3s}
.langbtn:hover{background:var(--red);border-color:var(--red)}
header.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:rgba(255,255,255,.86);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border-bottom:1px solid transparent;transition:border-color .3s,box-shadow .3s}
header.hd.sc{border-bottom-color:var(--line);box-shadow:0 10px 30px -24px rgba(0,0,0,.35)}
header.hd .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;height:84px;transition:height .4s var(--ease)}
header.hd.sc .wrap{height:70px}
.brand img{height:54px;width:auto;transition:height .4s var(--ease)}
header.hd.sc .brand img{height:44px}
.hd-l{display:flex;align-items:center;gap:clamp(24px,3.4vw,52px);min-width:0}
nav.mn{display:flex;gap:clamp(18px,2.2vw,34px);padding-inline-start:clamp(24px,3.4vw,52px);border-inline-start:1px solid var(--line)}
nav.mn a{position:relative;padding:8px 0;font-weight:500;font-size:15.5px;color:#6a6a6a;transition:color .3s}
nav.mn a::after{content:"";position:absolute;inset-inline:0;bottom:0;height:2px;border-radius:2px;background:var(--red);transform:scaleX(0);transform-origin:center;transition:transform .45s var(--ease)}
nav.mn a:hover{color:var(--ink)}
nav.mn a:hover::after{transform:scaleX(.45)}
nav.mn a.on{color:var(--ink);font-weight:600}
nav.mn a.on::after{transform:scaleX(1)}
.hd-tools{display:flex;align-items:center;gap:8px}
.ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);background:#fff;transition:border-color .3s,background .3s,color .3s}
.ic:hover{border-color:var(--red);color:var(--red)}
.ic svg{width:19px;height:19px}
.burger{display:none}
.drawer{position:fixed;inset:0;z-index:80;background:#fff;display:grid;grid-template-rows:auto 1fr auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));transform:translateX(100%);transition:transform .6s var(--ease)}
html[dir=ltr] .drawer{transform:translateX(-100%)}
.drawer.open{transform:none!important}
.drawer{overflow-y:auto;overscroll-behavior:contain}
@media (max-height:560px){.drawer nav{align-content:start;padding-block:10px}.drawer nav a{font-size:20px;padding:8px 0}}
.drawer .top{display:flex;justify-content:space-between;align-items:center}
.drawer nav{display:grid;align-content:center;gap:4px}
.drawer nav a{font-size:28px;font-weight:600;padding:12px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}
.drawer nav a svg{width:26px;height:26px;color:var(--red);flex:none}
.drawer nav a.on{color:var(--red)}

/* Hero slider */
.hero{padding-top:18px}
.hero-top{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(18px,2.2vw,30px);align-items:start;padding-block:clamp(18px,3vw,40px) clamp(24px,3vw,36px)}
.hero-top .ht-a{display:grid;gap:18px;min-width:0}
.hero-top h1{white-space:nowrap;font-size:clamp(34px,5.4vw,84px);font-weight:700;line-height:1.05;letter-spacing:-.02em;color:var(--ink)}
html[lang=ar] .hero-top h1{line-height:1.18;letter-spacing:0}
.hero-top h1 em{font-style:normal;color:var(--red)}
.hero-top .ht-b{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px 40px;min-width:0}
.hero-top .ht-b .lead{max-width:620px;margin:0;text-wrap:pretty}
.hero-top h1.two{white-space:normal;text-wrap:balance}
.hero-top .row{display:flex;gap:12px;flex-wrap:wrap}
.slider{position:relative;border-radius:30px;overflow:hidden;background:var(--ink-2);aspect-ratio:3/1;min-height:380px;isolation:isolate}
.cap{position:absolute;z-index:6;inset-inline-start:clamp(16px,2.4vw,30px);bottom:clamp(16px,2.4vw,30px);display:grid;gap:4px;max-width:min(440px,60%);padding:18px 22px 18px;border-radius:22px;background:rgba(18,16,16,.58);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);color:#fff;border:1px solid rgba(255,255,255,.12);transition:background .3s}
.cap:hover{background:rgba(18,16,16,.72)}
.cap-k{font-size:12.5px;color:rgba(255,255,255,.7);display:flex;gap:8px;align-items:center}
.cap b{font-size:clamp(19px,1.8vw,26px);font-weight:600;line-height:1.3}
.cap-n{font-size:13.5px;color:rgba(255,255,255,.78)}
.cap-go{margin-top:8px;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.cap-go svg{width:16px;height:16px}
html[dir=rtl] .cap-go svg{transform:scaleX(-1)}
.glass{background:rgba(18,16,16,.45)!important;border-color:rgba(255,255,255,.2)!important;color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.glass:hover{background:var(--red)!important;border-color:var(--red)!important;color:#fff!important}
html[dir=rtl] .hero-ui .glass svg{transform:scaleX(-1)}
.hd-cat{height:46px;padding-inline:18px;font-size:14px}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.3s cubic-bezier(.4,0,.2,1)}
.slide.on{opacity:1;z-index:2}
.slide.leaving{opacity:1;z-index:1;transition:none}
.slide .im{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide .im{transform:scale(1.12);transition:transform 7.5s cubic-bezier(.2,.6,.3,1);will-change:transform}
.slide.on .im{transform:scale(1)}
@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1)}}
@keyframes wipe{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0)}}
@keyframes wipeL{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
.slides{position:absolute;inset:0}
.slides::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(0deg,rgba(15,12,12,.38) 0%,rgba(15,12,12,0) 40%)}
.hero-copy{position:absolute;z-index:4;inset-block:0;inset-inline-start:0;width:min(660px,60%);display:grid;align-content:center;gap:20px;padding-inline:clamp(26px,5vw,72px);color:#fff}
.hero-copy .kicker{color:#fff}
.k-dark{color:#fff!important}
.hero-copy h1{font-size:clamp(32px,4.1vw,58px);font-weight:700;line-height:1.08;letter-spacing:-.015em}
.hero-copy h1 em,.band h2 span{font-style:normal;color:#fff;background:linear-gradient(transparent 60%,var(--red) 60%,var(--red) 92%,transparent 92%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero-copy p{margin:0;color:rgba(255,255,255,.82);font-size:clamp(14px,1.2vw,17px);max-width:46ch}
.hero-copy .row{display:flex;gap:12px;flex-wrap:wrap}
.hero-ui{position:absolute;z-index:5;inset-inline-end:clamp(18px,3vw,36px);bottom:clamp(18px,3vw,32px);display:flex;align-items:center;gap:14px}
.bars{display:flex;gap:8px}
.bars button{width:46px;height:30px;display:grid;align-items:center}
.bars button i{display:block;height:3px;border-radius:3px;background:rgba(255,255,255,.35);overflow:hidden;position:relative}
.bars button i b{position:absolute;inset:0;background:#fff;transform:scaleX(0);transform-origin:right}
html[dir=ltr] .bars button i b{transform-origin:left}
.bars button.on i b{animation:fillbar 6.5s linear forwards}
.bars button.done i b{transform:scaleX(1)}
@keyframes fillbar{to{transform:scaleX(1)}}
.counter{color:#fff;font-size:13px;font-weight:500;min-width:52px}
.shop-slide{position:absolute;z-index:5;inset-inline-start:clamp(26px,5vw,72px);bottom:clamp(18px,3vw,32px);display:none}

/* Materials */
.mats{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:14px}
.mat{display:grid;justify-items:center;gap:12px;padding:18px 8px 16px;border-radius:var(--r);transition:background .4s;text-align:center}
.mat:hover{background:var(--blush)}
.mat .disc{position:relative;width:100%;max-width:132px;aspect-ratio:1;border-radius:50%;background:var(--stone);display:grid;place-items:center;overflow:hidden}
.mat .disc img{width:68%;height:68%;object-fit:contain;transition:transform .7s var(--ease)}
.mat:hover .disc img{transform:scale(1.12) rotate(-4deg)}
.mat .disc svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.mat .disc svg.ring circle{fill:none;stroke:var(--red);stroke-width:2;stroke-dasharray:302;stroke-dashoffset:302;transition:stroke-dashoffset .9s var(--ease)}
.mat:hover .disc svg.ring circle,.mat.on .disc svg.ring circle{stroke-dashoffset:0}
.mat b{font-weight:600;font-size:16px}
.mat small{color:var(--mute);font-size:12.5px;margin-top:-10px}
.mat .grid4{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:56%;height:56%}
.mat .grid4 span{border-radius:6px;background:var(--red)}
.mat .grid4 span:nth-child(2),.mat .grid4 span:nth-child(3){background:var(--ink)}

/* Product card */
.pc{position:relative;display:grid;gap:12px;min-width:0;color:var(--ink)}
.ph{position:relative;aspect-ratio:1/1;border-radius:var(--r);background:var(--stone);overflow:hidden;display:grid;place-items:center}
.ph img{width:78%;height:78%;object-fit:contain;opacity:0;transition:opacity .5s,transform .8s var(--ease)}
.ph img.ld{opacity:1}
.pc:hover .ph img{transform:scale(1.07)}
.ph::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .4s}
.pc:hover .ph::after{box-shadow:inset 0 0 0 1.5px var(--red)}
.ph .go{position:absolute;bottom:12px;inset-inline-end:12px;width:40px;height:40px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;transform:scale(.4);opacity:0;transition:.45s var(--ease)}
.ph .go svg{width:17px;height:17px}
html[dir=rtl] .ph .go svg{transform:scaleX(-1)}
.pc:hover .ph .go{transform:none;opacity:1}
.ph .new{position:absolute;top:12px;inset-inline-start:12px;background:var(--red);color:#fff;font-size:11.5px;font-weight:500;padding:3px 10px;border-radius:999px}
.pm{display:grid;gap:3px;padding-inline:4px}
.pm small{color:var(--red);font-size:12.5px;font-weight:500}
.pm h4{font-size:15px;font-weight:500;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Bento */
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:240px;gap:16px}
.bt{position:relative;border-radius:26px;background:var(--stone);overflow:hidden;display:flex;flex-direction:column;padding:22px;isolation:isolate;transition:background .4s;min-width:0}
.bt0{grid-column:span 2;grid-row:span 2;background:var(--blush)}
.bt-imgs{position:relative;flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 0 0;margin-bottom:14px}
.bt-row{display:flex;align-items:flex-end;justify-content:center;gap:5%;width:100%;height:100%}
@supports (container-type:size){.bt-imgs{container-type:size}.bt-row{height:auto}}
.bt-tx,.bt-go{z-index:1}
.bt-tx{position:relative}
.bt-imgs img{flex:1 1 0;min-width:0;max-width:48%;height:100%;object-fit:contain;object-position:center bottom;opacity:0;transition:opacity .5s,transform .8s var(--ease)}
.bt-imgs img.ld{opacity:1}
/* product photos are pre-tinted with the card colour (img/ = stone, img/b/ = blush), so no blending is needed */
.bt0 .bt-imgs{padding:18px 6px 0;margin-bottom:22px}
.bt0 .bt-row{gap:4%}
@supports (container-type:size){.bt-imgs img{height:auto;max-height:100cqh}}
@media (hover:hover){.bt:hover .bt-imgs img{transform:translateY(-6px) scale(1.05)}}
.bt-tx{display:grid;gap:2px;flex:none;padding-inline-end:56px}
.bt-tx b{font-size:18px;font-weight:600;line-height:1.3}
.bt0 .bt-tx b{font-size:clamp(22px,2.4vw,32px)}
.bt-tx span{color:var(--mute);font-size:13.5px}
.bt-go{position:absolute;bottom:22px;inset-inline-end:22px;width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;transition:background .3s,color .3s}
.bt-go svg{width:17px;height:17px}
html[dir=rtl] .bt-go svg{transform:scaleX(-1)}
@media (hover:hover){.bt:hover .bt-go{background:var(--red);color:#fff}}
.psp{display:inline-flex;align-items:center;gap:6px;color:var(--mute);font-size:12.5px;margin-top:2px}
.psp svg{width:14px;height:14px;color:var(--mute-2)}
.pnav{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.pnav a{display:flex;align-items:center;gap:14px;border:1.5px solid var(--line);border-radius:20px;padding:12px;min-width:0;transition:border-color .3s}
.pnav a:hover{border-color:var(--red)}
.pnav a.nx{flex-direction:row-reverse;text-align:end}
.pnav .ph{width:64px;height:64px;border-radius:14px;flex:none}
.pnav div{display:grid;min-width:0}
.pnav small{color:var(--red);font-size:12.5px;font-weight:500}
.pnav b{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Rail */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(220px,22%,290px);gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:6px;cursor:grab}
.rail::-webkit-scrollbar{display:none}
.rail.drag{cursor:grabbing;scroll-snap-type:none}
.rail .pc{scroll-snap-align:start}
.rail-ctl{display:flex;gap:10px}
html[dir=rtl] .rail-ctl svg{transform:scaleX(-1)}
.track{height:2px;background:var(--line);margin-top:28px;border-radius:2px;position:relative;overflow:hidden}
.track i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--red);border-radius:2px;transition:width .2s,transform .2s}

/* Dark band */
.band{background:var(--ink-2);color:#fff;border-radius:34px;overflow:hidden;position:relative}
.band .in{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(30px,5vw,80px);align-items:center;padding:clamp(34px,6vw,90px)}
.band h2{color:#fff}

.band .lead{color:#b9b9b9}
.band .pic{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:4/3}
.band .pic img{width:100%;height:118%;object-fit:cover;position:absolute;top:-9%}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:10px;border-top:1px solid rgba(255,255,255,.14)}
.stats div{padding-top:18px;display:grid;gap:2px;justify-items:start;align-content:start}
.stats b{font-size:clamp(28px,3vw,42px);font-weight:600;line-height:1.1}
.stats .si{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.07);display:grid;place-items:center;margin-bottom:8px}
.stats .si svg{width:20px;height:20px;color:#fff}
.stats span{color:#9a9a9a;font-size:13px}
.feats{display:grid;gap:10px}
.feats div{display:flex;align-items:center;gap:12px;color:#e6e6e6;font-size:15px}
.feats .fi{width:36px;height:36px;border-radius:50%;background:var(--red);display:grid;place-items:center;flex:none}
.feats .fi svg{width:18px;height:18px;color:#fff}
.big-j{position:absolute;inset-inline-end:-30px;bottom:-60px;font-size:300px;font-weight:800;line-height:1;color:rgba(255,255,255,.03);pointer-events:none}

/* Sectors */
.sectors{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.sector{border:1.5px solid var(--line);border-radius:var(--r);padding:26px 18px;display:grid;gap:16px;justify-items:center;align-content:start;text-align:center;transition:border-color .4s,translate .5s var(--ease),background .4s}
.sector:hover{border-color:var(--red);translate:0 -6px;background:var(--blush)}
.sector .icw{width:72px;height:72px;border-radius:50%;background:var(--red-wash);display:grid;place-items:center;transition:background .4s}
.sector:hover .icw{background:#fff}
.sector img{width:38px;height:38px}
.sector b{font-weight:500}

/* Brands */
.brands{border-block:1px solid var(--line);overflow:hidden;padding-block:30px;mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.brands .mq{display:flex;align-items:center;gap:90px;width:max-content;animation:mq 30s linear infinite}
html[dir=rtl] .brands .mq{animation-name:mqr}
.brands img{height:58px;width:auto;opacity:.7;transition:opacity .3s}
.brands img:hover{opacity:1}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes mqr{to{transform:translateX(50%)}}

/* CTA */
.cta{position:relative;border-radius:34px;overflow:hidden;background:var(--red);color:#fff;padding:clamp(34px,6vw,80px);display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:center}
.cta::before{content:"";position:absolute;width:560px;height:560px;border-radius:50%;border:80px solid rgba(255,255,255,.06);inset-inline-end:-160px;top:-220px}
.cta::after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;border:50px solid rgba(255,255,255,.06);inset-inline-end:120px;bottom:-200px}
.cta > *{position:relative;z-index:1;min-width:0}
.cta h2{color:#fff}
.cta p{color:rgba(255,255,255,.85);margin:0}
.cta .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}

/* Page head */
.phead{background:var(--blush);border-bottom:1px solid var(--line)}
.phead .wrap{padding-block:clamp(34px,5vw,64px);display:grid;gap:14px}
.crumb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--mute);font-size:14px}
.crumb a:hover{color:var(--red)}
.crumb svg{width:13px;height:13px}
html[dir=rtl] .crumb svg{transform:scaleX(-1)}
.phead h1{font-size:clamp(32px,4.4vw,58px);font-weight:700}

/* Products page */
.shop{display:grid;grid-template-columns:290px minmax(0,1fr);gap:clamp(24px,3vw,44px);padding-block:clamp(30px,4vw,54px) 90px;align-items:start}
.side{position:sticky;top:calc(90px + env(safe-area-inset-top,0px));display:grid;gap:14px;max-height:calc(100vh - 110px);min-height:0}
.side .box{border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;max-height:calc(100vh - 110px - env(safe-area-inset-top,0px));background:#fff}
.side h3{font-size:16px;padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.side h3 small{color:var(--mute);font-weight:400}
.catlist{overflow:auto;padding:8px;display:grid;gap:2px;scrollbar-width:thin;align-content:start}
.catlist button{display:flex;justify-content:space-between;gap:10px;text-align:start;padding:9px 12px;border-radius:12px;font-size:14px;color:#4a4a4a;transition:background .25s,color .25s}
.catlist button small{color:var(--mute-2);font-size:12px}
.catlist button:hover{background:var(--stone);color:var(--ink)}
.catlist button.on{background:var(--red);color:#fff}
.catlist button.on small{color:rgba(255,255,255,.75)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:24px}
.chips{display:flex;gap:8px;flex-wrap:wrap;min-width:0}
.chip{height:40px;padding-inline:16px;border-radius:999px;border:1.5px solid var(--line);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:7px;transition:.3s;background:#fff}
.chip small{color:var(--mute-2);font-weight:400}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.on small{color:#bdbdbd}
.sbox{position:relative;flex:1 1 240px;max-width:340px}
.sbox input{width:100%;height:46px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:14.5px;padding-inline:44px 18px;color:var(--ink);outline:none;transition:border-color .3s}
.sbox input:focus{border-color:var(--red)}
.sbox svg{position:absolute;inset-inline-start:16px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--mute)}
.res{color:var(--mute);font-size:14px;margin-bottom:22px;display:flex;align-items:center;gap:8px}
.res svg{width:17px;height:17px;color:var(--red)}
.side h3 .hi{display:inline-flex;align-items:center;gap:8px}
.side h3 svg{width:18px;height:18px;color:var(--red)}
.group h3 svg{width:20px;height:20px;color:var(--red);flex:none}
.empty svg{width:34px;height:34px;color:var(--red);margin:0 auto 10px;display:block}
.empty p{margin:0}
.res b{color:var(--ink);font-weight:500}
.group{margin-bottom:46px}
.group h3{font-size:20px;font-weight:600;display:flex;align-items:center;gap:12px;margin-bottom:18px}
.group h3::after{content:"";flex:1;height:1px;background:var(--line)}
.group h3 small{color:var(--mute);font-weight:400;font-size:13px}
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px 18px}
.empty{padding:70px 20px;text-align:center;color:var(--mute);border:1.5px dashed var(--line);border-radius:var(--r)}
.mob-cats{display:none}

/* Product detail */
.pd{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,80px);padding-block:clamp(30px,4vw,60px) 40px;align-items:start}
.pd .ph{aspect-ratio:1/1;border-radius:30px;cursor:zoom-in}
.pd .ph img{width:76%;height:76%;transition:transform .3s ease-out,opacity .5s}
.pd .ph:hover img{transform:scale(1.7)}
.pd-info{display:grid;gap:22px;align-content:start;min-width:0}
.pd-info h1{font-size:clamp(26px,3vw,40px);font-weight:600;line-height:1.3}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:13px;padding:5px 12px;border-radius:999px;background:var(--red-wash);color:var(--red);font-weight:500}
.tag.g{background:var(--stone);color:var(--ink)}
.spec{border-radius:20px;overflow:hidden;border:1.5px solid var(--line)}
.spec div{display:grid;grid-template-columns:140px minmax(0,1fr);border-bottom:1px solid var(--line)}
.spec div:last-child{border-bottom:0}
.spec span{background:var(--blush);padding:14px 18px;color:var(--mute);font-size:14px;display:flex;align-items:center;gap:9px}
.spec span svg{width:17px;height:17px;color:var(--red);flex:none}
.spec b{padding:14px 18px;font-weight:500;overflow-wrap:anywhere}
.pd-info .row{display:flex;gap:12px;flex-wrap:wrap}
.copied{font-size:13px;color:var(--ok)}

/* About */
.ab{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,5vw,80px);align-items:center}
.ab .txt{display:grid;gap:18px;min-width:0}
.ab .txt p{margin:0;color:#555;font-size:16.5px}
.ap{display:flex;gap:14px;align-items:flex-start}
.api{width:42px;height:42px;border-radius:12px;background:var(--red-wash);color:var(--red);display:grid;place-items:center;flex:none}
.api svg{width:20px;height:20px}
.ab .imgf{border-radius:30px;overflow:hidden;aspect-ratio:520/357;position:relative}
.ab .imgf img{width:100%;height:100%;object-fit:cover}
.ab .imgf .stamp{position:absolute;bottom:18px;inset-inline-start:18px;background:#fff;border-radius:16px;padding:12px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 20px 40px -20px rgba(0,0,0,.4)}
.ab .imgf .stamp b{font-size:26px;color:var(--red);font-weight:700}
.ab .imgf .stamp span{font-size:13px;color:var(--mute);line-height:1.4}

/* Contact */
.ct{display:grid;grid-template-columns:1fr 1.15fr;gap:clamp(26px,4vw,60px);padding-block:clamp(30px,4vw,60px) 90px}
.cards{display:grid;gap:12px;align-content:start}
.cc{display:flex;gap:16px;align-items:center;border:1.5px solid var(--line);border-radius:20px;padding:18px 20px;min-width:0;transition:border-color .3s}
.cc:hover{border-color:var(--red)}
.cc .icw{width:48px;height:48px;border-radius:14px;background:var(--red-wash);color:var(--red);display:grid;place-items:center;flex:none}
.cc .icw svg{width:22px;height:22px}
.cc > div{display:grid;min-width:0;flex:1}
.cc span{color:var(--mute);font-size:13px}
.cc b{font-weight:500;font-size:17px;overflow-wrap:anywhere;user-select:all}
.cc .cp{font-size:12.5px;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;flex:none}
.cc .cp:hover{border-color:var(--ink)}
.hrs{display:grid;gap:4px;font-size:14.5px;margin-top:4px}
.hrs div{display:flex;justify-content:space-between;flex-wrap:wrap;gap:0 12px}
.hrs b{overflow-wrap:normal;user-select:text}
.hrs em{white-space:nowrap}
.cc b.ltr,.cc b.num{overflow-wrap:normal;white-space:nowrap}
.hrs em{font-style:normal;color:var(--mute)}
.map{border-radius:20px;overflow:hidden;position:relative;background:var(--ink-2);color:#fff;padding:22px;display:grid;gap:10px;min-height:170px;align-content:end;isolation:isolate}
.map::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.35;background-image:linear-gradient(rgba(255,255,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px);background-size:28px 28px}
.map .pin{position:absolute;top:34px;inset-inline-end:44px;width:20px;height:20px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(174,31,35,.6);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 22px rgba(174,31,35,0)}100%{box-shadow:0 0 0 0 rgba(174,31,35,0)}}
.map span{color:#bbb;font-size:13px}
form.qf{border:1.5px solid var(--line);border-radius:30px;padding:clamp(22px,3vw,40px);display:grid;grid-template-columns:1fr 1fr;gap:16px;align-content:start;background:var(--blush)}
.qf h3{grid-column:1/-1;font-size:26px}
.qf .note{grid-column:1/-1;margin:-8px 0 4px;color:var(--mute);font-size:14px}
.f{display:grid;gap:6px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:13.5px;font-weight:500}
.f input,.f textarea{width:100%;border:1.5px solid var(--line);border-radius:14px;background:#fff;font:inherit;font-size:15px;padding:12px 14px;color:var(--ink);outline:none;transition:border-color .3s}
.f textarea{min-height:130px;resize:vertical}
.fw{position:relative;display:block}
.fw svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mute-2);pointer-events:none}
.fw.ta svg{top:15px;transform:none}
.f .fw input,.f .fw textarea{padding-inline-start:42px}
.f input:focus,.f textarea:focus{border-color:var(--red)}
.qf .out{grid-column:1/-1;font-size:14.5px;color:var(--ink)}
.qf .out a{color:var(--red);font-weight:500;text-decoration:underline;text-underline-offset:4px}

/* Footer */
footer{background:var(--ink-2);color:#cfcfcf;margin-top:clamp(40px,6vw,80px);padding-block:70px calc(28px + env(safe-area-inset-bottom,0px))}
.fg{display:grid;grid-template-columns:1.7fr 1fr 1fr 1.2fr;gap:40px}
.fg img.fl{height:66px;width:auto}
.fg p{font-size:14px;color:#a8a8a8;margin:18px 0 0;max-width:48ch}
.fg h5{margin:0 0 16px;color:#fff;font-size:16px;font-weight:600}
.fg ul{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:14.5px}
.fg ul a:hover{color:#fff}
.fg ul a{display:inline-flex;align-items:center;gap:9px}
.fg ul a::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--red);flex:none}
.fi2{display:flex;align-items:center;gap:10px}
.fi2 svg{width:18px;height:18px;color:#fff;flex:none;padding:7px;box-sizing:content-box;border-radius:10px;background:rgba(255,255,255,.07)}
.soc{display:flex;gap:10px;margin-top:20px}
.soc a{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);transition:background .3s}
.soc a:hover{background:var(--red)}
.soc svg{width:19px;height:19px;color:#fff}
.fb{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.1);margin-top:50px;padding-top:24px;font-size:13px;color:#8f8f8f}
.wa{position:fixed;z-index:50;bottom:calc(22px + env(safe-area-inset-bottom,0px));inset-inline-start:calc(22px + env(safe-area-inset-left,0px));width:58px;height:58px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 14px 30px -10px rgba(37,211,102,.7);transition:transform .4s var(--ease)}
.wa{inset-inline-start:auto;inset-inline-end:calc(22px + env(safe-area-inset-left,0px))}
html[dir=ltr] .wa{inset-inline-end:calc(22px + env(safe-area-inset-right,0px))}
.wa{opacity:0;pointer-events:none;transform:scale(.6);transition:transform .4s var(--ease),opacity .35s}
.wa.show{opacity:1;pointer-events:auto;transform:none}
.wa.show:hover{transform:scale(1.08)}
.wa svg{width:30px;height:30px;color:#fff}

/* Search overlay */
.so{position:fixed;inset:0;z-index:85;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);display:grid;grid-template-rows:auto 1fr;padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 20px max(20px,env(safe-area-inset-left,0px));opacity:0;pointer-events:none;transition:opacity .35s}
.so.open{opacity:1;pointer-events:auto}

/* Reveal helper (motion only; content is visible at rest) */

#app{transition:opacity .28s ease}
#app.leaving{opacity:0}

/* =====================================================================================
   v4 — full-width layout, uncropped banners, dark bands, page wipe, richer motion
   (kept last in the stylesheet so these rules win over the earlier ones)
   ===================================================================================== */
:root{--gut:clamp(20px,4.4vw,84px);--dark:#1d1d1d}
.wrap{max-width:none;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}

/* ---------- page wipe: red sheet, then a dark sheet carrying the white logo, rising bottom → top ---------- */
.wipe{position:fixed;inset:0;z-index:120;pointer-events:none;visibility:hidden}
.wipe > *{position:absolute;inset:0;transform:translateY(101%);will-change:transform}
.wipe .w1{background:var(--red)}
.wipe .w2{background:var(--dark);display:grid;place-items:center}
.wipe .w2 img{width:clamp(96px,10vw,130px);opacity:0;transform:translateY(18px) scale(.96)}
.wipe.in{visibility:visible;pointer-events:auto}
.wipe.in .w1{transition:transform .55s cubic-bezier(.76,0,.24,1);transform:none}
.wipe.in .w2{transition:transform .55s cubic-bezier(.76,0,.24,1) .1s;transform:none}
.wipe.in .w2 img{transition:opacity .35s ease .42s,transform .6s cubic-bezier(.22,.8,.12,1) .42s;opacity:1;transform:none}
.wipe.in.out .w2{transition:transform .65s cubic-bezier(.76,0,.24,1);transform:translateY(-101%)}
.wipe.in.out .w1{transition:transform .65s cubic-bezier(.76,0,.24,1) .1s;transform:translateY(-101%)}
.wipe.in.out .w2 img{transition:none}
.curtain{background:var(--dark)}
.curtain.intro{animation:introUp .85s cubic-bezier(.76,0,.24,1) 1.15s forwards}
@keyframes introUp{0%{transform:none;opacity:1;visibility:visible}99%{transform:translateY(-101%);opacity:1;visibility:visible}100%{transform:translateY(-101%);opacity:0;visibility:hidden}}

/* ---------- headings: words rise out of a mask ---------- */
.wd{display:inline-block;overflow:hidden;vertical-align:top;padding-block:.14em .16em;margin-block:-.14em -.16em}
.wd > span{display:inline-block;transform:translateY(110%);transition:transform 1.05s cubic-bezier(.22,.8,.12,1);transition-delay:calc(var(--d,0s) + var(--i,0) * 55ms)}
.sp-on .wd > span{transform:none}
/* large photos are uncovered by a sliding panel */
.rvimg{clip-path:inset(0 0 100% 0);transition:clip-path 1.25s cubic-bezier(.77,0,.18,1)}
.rvimg > img{transform:scale(1.18);transition:transform 1.8s cubic-bezier(.22,.61,.36,1)}
.rvimg.rv-on{clip-path:inset(0 0 0 0)}
.rvimg.rv-on > img{transform:none}

/* ---------- hero ---------- */
.hero{padding-top:clamp(8px,1.2vw,18px)}
.hero-top{padding-block:clamp(18px,2.6vw,38px) clamp(22px,2.4vw,34px);gap:clamp(14px,1.6vw,22px)}
.hero-top h1 em{color:inherit}
.hero-top .ht-b{display:grid;justify-items:start;gap:22px}
.hero-top .ht-b .lead{max-width:780px}
.slider{aspect-ratio:auto;min-height:0;display:grid;border-radius:28px;background:var(--dark);overflow:hidden;isolation:isolate}
.stage{position:relative;aspect-ratio:3.15/1;overflow:hidden;background:#efe6dc;cursor:pointer}
.stage .slide{position:absolute;inset:0;opacity:0;transition:opacity 1.3s cubic-bezier(.4,0,.2,1)}
.stage .slide.on{opacity:1;z-index:2}
.stage .slide.leaving{opacity:1;z-index:1;transition:none}
.stage .sbg{position:absolute;inset:-8%;width:116%;height:116%;object-fit:cover;opacity:.95}
.stage .im{position:absolute;max-width:none;transform-origin:var(--ox,50%) var(--oy,50%);transform:scale(1.055);transition:transform 7.5s cubic-bezier(.2,.6,.3,1);will-change:transform}
.stage .slide.on .im{transform:scale(1)}
.stage .im.fx{-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.stage .im.fy{-webkit-mask-image:linear-gradient(180deg,transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(180deg,transparent,#000 9%,#000 91%,transparent)}
.sbar{display:flex;align-items:center;justify-content:space-between;gap:18px 30px;padding:clamp(16px,1.8vw,24px) clamp(20px,2.4vw,34px);color:#fff;flex-wrap:wrap}
.scap{display:flex;align-items:center;gap:14px 28px;min-width:0;flex-wrap:wrap}
.scap .st{display:grid;gap:2px;min-width:0}
.scap .sk{font-size:12.5px;color:rgba(255,255,255,.6)}
.scap b{font-size:clamp(19px,1.6vw,25px);font-weight:600;line-height:1.3}
.scap .sn{font-size:13.5px;color:rgba(255,255,255,.72)}
.scap .sgo{display:inline-flex;align-items:center;gap:8px;height:42px;padding-inline:18px;border-radius:999px;border:1.5px solid rgba(255,255,255,.3);font-size:14px;font-weight:500;transition:background .35s,color .35s,border-color .35s;white-space:nowrap}
.scap .sgo svg{width:15px;height:15px}
html[dir=rtl] .scap .sgo svg{transform:scaleX(-1)}
@media (hover:hover){.scap:hover .sgo{background:#fff;color:var(--ink);border-color:#fff}}
.sctl{display:flex;align-items:center;gap:14px}
.sctl .ic{background:transparent;border-color:rgba(255,255,255,.3);color:#fff}
@media (hover:hover){.sctl .ic:hover{background:#fff;color:var(--ink);border-color:#fff}}
html[dir=rtl] .sctl .ic svg{transform:scaleX(-1)}
.sctl .counter{color:#fff;min-width:56px;text-align:center}
.sbars{display:flex;gap:8px}
.sbars button{width:44px;height:28px;display:grid;align-items:center}
.sbars i{display:block;height:3px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden;position:relative}
.sbars i b{position:absolute;inset:0;background:#fff;transform:scaleX(0);transform-origin:right}
html[dir=ltr] .sbars i b{transform-origin:left}
.sbars button.on i b{animation:fillbar 7s linear forwards}
.sbars button.done i b{transform:scaleX(1)}

/* ---------- full-width dark band: materials ---------- */
.dark3{margin-top:clamp(64px,8vw,120px);background:var(--dark)}
.mat3{transition:transform .55s cubic-bezier(.22,.8,.12,1),background .45s,border-color .45s,box-shadow .55s}
.mat3 .disc{transition:background .45s}
.mat3 b,.mat3 small{transition:color .35s}
.mat3 .grid4 span{transition:background .4s,transform .5s cubic-bezier(.22,.8,.12,1)}
@media (hover:hover){
  .mat3:hover{transform:translateY(-10px) scale(1.045);background:#fff;border-color:#fff;box-shadow:0 34px 60px -34px rgba(0,0,0,.75)}
  .mat3:hover .disc{background:var(--red-wash)}
  .mat3:hover b{color:var(--red)}
  .mat3:hover small{color:var(--mute)}
  .mat3:hover .grid4 span{background:var(--red)}
  .mat3:hover .grid4 span:nth-child(1){transform:translate(-3px,-3px)}
  .mat3:hover .grid4 span:nth-child(2){transform:translate(3px,-3px)}
  .mat3:hover .grid4 span:nth-child(3){transform:translate(-3px,3px)}
  .mat3:hover .grid4 span:nth-child(4){transform:translate(3px,3px)}
}

/* ---------- full-width dark band: made locally ---------- */
.made4{background:var(--dark);color:#fff;overflow:hidden;margin-top:clamp(64px,8vw,120px)}
.made4 .in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:stretch;gap:clamp(30px,5vw,90px)}
.made4 .mt{display:grid;gap:22px;align-content:center;padding-block:clamp(56px,7vw,110px) clamp(30px,3vw,44px);min-width:0}
.made4 h2{color:#fff;font-size:clamp(32px,4vw,60px);line-height:1.15}
.made4 h2 > span:not(.wd){display:block;color:var(--red)}
.made4 .lead{color:rgba(255,255,255,.72);max-width:640px}
.made4 .row{display:flex;gap:12px;flex-wrap:wrap}
.made4 .feats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid rgba(255,255,255,.12);margin-top:6px}
.made4 .feats3 div{display:grid;justify-items:start;align-content:start;gap:12px;padding:22px 18px 0;border-inline-start:1px solid rgba(255,255,255,.12);font-weight:500;font-size:15.5px;line-height:1.5;color:#fff}
.made4 .feats3 div:first-child{border-inline-start:0;padding-inline-start:0}
.made4 .feats3 .fi{width:48px;height:48px;border-radius:50%;background:rgba(174,31,35,.18);color:#fff;display:grid;place-items:center;border:1px solid rgba(174,31,35,.55)}
.made4 .feats3 .fi svg{width:22px;height:22px}
.made4 .mp{position:relative;margin-inline-end:calc(-1 * max(var(--gut),env(safe-area-inset-left,0px)));min-height:100%;overflow:hidden}
.made4 .mp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.made4 .mp::after{content:"";position:absolute;inset:0;background:linear-gradient(to right,rgba(29,29,29,0) 72%,var(--dark) 100%);pointer-events:none}
html[dir=ltr] .made4 .mp::after{background:linear-gradient(to left,rgba(29,29,29,0) 72%,var(--dark) 100%)}
.made4 + .cta3{margin-top:0}
.mstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid rgba(255,255,255,.12)}
.mstats > div{display:flex;align-items:center;gap:20px;padding:clamp(26px,3vw,44px) clamp(14px,2vw,34px);border-inline-start:1px solid rgba(255,255,255,.12);min-width:0}
.mstats > div:first-child{border-inline-start:0;padding-inline-start:0}
.mstats .si{width:clamp(52px,4.4vw,66px);height:clamp(52px,4.4vw,66px);border-radius:50%;background:var(--red);display:grid;place-items:center;flex:none}
.mstats .si svg{width:44%;height:44%;color:#fff}
.mstats .sv{display:grid;min-width:0}
.mstats b{font-size:clamp(40px,4.6vw,78px);font-weight:700;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.mstats span.sl{color:rgba(255,255,255,.62);font-size:clamp(13.5px,1.05vw,16px);margin-top:8px}

/* ---------- full-width red band: catalogue ---------- */
.cta3{border-radius:0;padding:0;display:block;margin-top:clamp(64px,8vw,120px)}
.cta3::before{inset-inline-end:-120px;top:-300px;width:760px;height:760px;border-width:110px}
.cta3 .in{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:30px;align-items:center;padding-block:clamp(56px,7vw,110px)}
.cta3 h2{font-size:clamp(32px,4vw,60px)}
.cta3 .cover{width:min(320px,100%)}
footer{margin-top:0}
#app > :last-child:not(.cta3):not(.sec){margin-bottom:clamp(64px,8vw,120px)}

/* ---------- inner page heads: dark ---------- */
.phead{background:var(--dark);border-bottom:0}
.phead h1{color:#fff}
.phead .crumb{color:rgba(255,255,255,.6)}
.phead .crumb span{color:#fff}
@media (hover:hover){.phead .crumb a:hover{color:#fff}}
.phead .wrap{padding-block:clamp(40px,5.4vw,80px)}

/* ---------- products page ---------- */
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.chip.on small{color:rgba(255,255,255,.8)}
.side .box{border-radius:14px}
.catlist{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.catlist button{border-radius:8px}
@media (min-width:1440px){.pgrid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (min-width:1500px){.bento{grid-auto-rows:270px}}
@media (min-width:1400px){.pd{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}.pd .ph{aspect-ratio:5/4}}

/* ---------- contact page ---------- */
.ct4{padding-block:clamp(28px,3.4vw,48px) 0}
.ct4 .cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.4fr);gap:14px}

.cmain{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(22px,2.6vw,40px);margin-top:clamp(22px,2.6vw,36px);align-items:start}

@media (hover:hover){.bchip:hover{border-color:var(--red);transform:translateY(-2px)}}

.cmain .mapbox{position:relative;top:0;aspect-ratio:16/9}
.mapbox .mcap .mi{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:2px}
.cmain .qf{margin:0;align-self:stretch;grid-template-rows:auto auto auto auto minmax(0,1fr) auto}

    return{r:'products',f:ok?{[m[1]==='c'?'cat':'tag']:+m[2]}:(m?{cat:0,tag:0}:null)}}

  if(h==='latest')return{r:'home',a:'latest'};

function go(first){const R=parse();clearInterval(slideTimer);
  const swap=()=>{render(R);
    const el=R.a&&document.getElementById(R.a);
    if(el){const y=el.getBoundingClientRect().top+scrollY-(document.getElementById('hd').offsetHeight+12);window.scrollTo(0,Math.max(0,y))}
    else if(!first)window.scrollTo(0,0)};
  if(first||reduce){swap();return}
  /* page change: a red sheet and then a dark sheet carrying the logo rise over the page, the new page is drawn
     underneath, and both sheets carry on upwards to uncover it */
  const w=document.getElementById('wipe');clearTimeout(go.t1);clearTimeout(go.t2);
  w.classList.remove('out');void w.offsetWidth;w.classList.add('in');
  go.t1=setTimeout(()=>{swap();requestAnimationFrame(()=>{w.classList.add('out');go.t2=setTimeout(()=>w.classList.remove('in','out'),900)})},820);
}

function fitHero(){const h=document.querySelector('.hero-top h1');if(!h)return;
  h.classList.remove('two');h.style.fontSize='';const max=parseFloat(getComputedStyle(h).fontSize);
  const avail=h.parentElement.clientWidth;const r=document.createRange();r.selectNodeContents(h);const w=r.getBoundingClientRect().width;
  const fs=Math.min(84,max*(innerWidth<1100?1.4:1),max*avail/w*.985);
  if(fs>=(L==='ar'?28:30)){h.style.fontSize=fs.toFixed(2)+'px';return}
  /* phones: two balanced lines, as large as fits */
  h.classList.add('two');const lines=()=>{const t=new Set();const wds=h.querySelectorAll('.wd');for(const q of (wds.length?[...wds].map(e=>e.getBoundingClientRect()):r.getClientRects()))if(q.width>1)t.add(Math.round(q.top/4));return t.size};
  let f=42;h.style.fontSize=f+'px';r.selectNodeContents(h);while(f>28&&lines()>2){f-=1;h.style.fontSize=f+'px';r.selectNodeContents(h)}

/* ---------- Chrome ---------- */
const dr=document.getElementById('drawer');
document.getElementById('bBtn').onclick=()=>dr.classList.add('open');
document.getElementById('dClose').onclick=()=>dr.classList.remove('open');
dr.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>dr.classList.remove('open')));
addEventListener('keydown',e=>{if(e.key==='Escape'){closeS();dr.classList.remove('open')}});
const hd=document.getElementById('hd');addEventListener('scroll',()=>hd.classList.toggle('sc',scrollY>20),{passive:true});
/* WhatsApp bubble waits until the visitor scrolls past the home hero so it never covers the hero buttons */
const waB=document.querySelector('.wa');function waUpd(){waB.classList.toggle('show',route!=='home'||scrollY>innerHeight*.55)}
addEventListener('scroll',waUpd,{passive:true});addEventListener('resize',waUpd);addEventListener('hashchange',()=>setTimeout(waUpd,900));setTimeout(waUpd,400);
function applyLang(){document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
  document.getElementById('lang').textContent=L==='ar'?'English':'عربي';document.getElementById('lang2').textContent=L==='ar'?'EN':'ع';status()}
function toggleLang(){L=L==='ar'?'en':'ar';try{localStorage.setItem('jawad-l',L)}catch(e){}applyLang();render(parse())}
document.getElementById('lang').onclick=toggleLang;document.getElementById('lang2').onclick=toggleLang;
function status(){try{const f=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Riyadh',weekday:'short',hour:'numeric',minute:'numeric',hour12:false}).formatToParts(new Date());const g=k=>f.find(x=>x.type===k).value;const d=g('weekday'),m=(+g('hour')%24)*60+(+g('minute'));
  const open=(['Sat','Sun','Mon','Tue','Wed'].includes(d)&&m>=480&&m<960)||(d==='Thu'&&m>=480&&m<900);const st=document.getElementById('st');st.classList.toggle('st-open',open);document.getElementById('stT').textContent=open?t('open'):t('closed')}catch(e){}}
setInterval(status,60000);

/* ---------- Motion ---------- */
/* One rule everywhere: content rises 28px and fades in over ~1s as it enters the screen; items of the same group
   follow each other with a short, regular delay. Only opacity and transform move, so it stays smooth on older phones. */
const rvIO=('IntersectionObserver' in window)&&!reduce?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){rvIO.unobserve(e.target);e.target.classList.add('rv-on')}}),{rootMargin:'0px 0px -6% 0px'}):null;
function rv(els,step=.09,base=0,wrap=6){els.forEach((el,i)=>{if(!el)return;el.classList.add('rv');el.style.setProperty('--d',(base+(i%wrap)*step).toFixed(2)+'s');
  el.addEventListener('transitionend',function done(ev){if(ev.target!==el||ev.propertyName!=='transform'||!el.classList.contains('rv-on'))return;el.removeEventListener('transitionend',done);el.classList.remove('rv','rv-on');el.style.removeProperty('--d')});
  if(rvIO)rvIO.observe(el);else el.classList.add('rv-on')})}
const $$=q=>[...app.querySelectorAll(q)];let firstView=true;
function countUp(b){const n=+b.dataset.n;if(reduce||!n){b.textContent=n;return}const t0=performance.now(),D=2200;
  const f=now=>{const k=Math.min(1,(now-t0)/D);b.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
/* headings: every word rises out of its own mask */
function splitWords(h){if(h.dataset.sp)return;h.dataset.sp=1;let k=0;
  const walk=n=>{[...n.childNodes].forEach(c=>{if(c.nodeType===3){const parts=c.textContent.split(/(\s+)/);if(parts.length<1)return;const f=document.createDocumentFragment();
      parts.forEach(p=>{if(!p)return;if(/^\s+$/.test(p)){f.append(p);return}const o=document.createElement('span');o.className='wd';const i=document.createElement('span');i.textContent=p;i.style.setProperty('--i',k++);o.append(i);f.append(o)});c.replaceWith(f)}
    else if(c.nodeType===1&&c.tagName!=='SVG'&&c.tagName!=='svg')walk(c)})};walk(h)}
const spIO=('IntersectionObserver' in window)&&!reduce?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){spIO.unobserve(e.target);e.target.classList.add('sp-on')}}),{rootMargin:'0px 0px -8% 0px'}):null;
function motion(r){
  /* on the very first visit the hero waits for the logo curtain to lift, so its entrance is actually seen */
  const base=firstView?Math.max(.1,1.75-performance.now()/1000):.35;
  if(r==='home')rv([...$$('.hx-in > *')],.14,base,9);
  firstView=false;
  $$('.phead .wrap').forEach(w=>rv([...w.children],.12,base));
  if(spIO)$$('.phead h1, .head h2, .made5 h2, .cta3 h2, .brp h2').forEach(h=>{splitWords(h);spIO.observe(h)});
  if(r==='home')fitHero();
  $$('.head').forEach(h=>rv([h],0));
  ['.bento','.mats3','#rail','.sectors','.ab .txt','.cgrid','.bchips','.pgrid','.pd','.pnav','.cta3 .in','.made5 .m5t','.mf','.m5s','.cmain'].forEach(q=>$$(q).forEach(g=>rv([...g.children].filter(c=>!c.style.getPropertyValue('--d')&&!c.classList.contains('rvimg')),.1)));
  rv($$('.rv:not(.rv-on), .brands, .track').filter(e=>!e.style.getPropertyValue('--d')));
  $$('.rvimg').forEach(el=>{if(rvIO)rvIO.observe(el);else el.classList.add('rv-on')});
  if(r==='product')rv($$('#zoom'),0);
  const sio=('IntersectionObserver' in window)?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){sio.unobserve(e.target);countUp(e.target)}}),{threshold:.6}):null;
  $$('.m5s b[data-n]').forEach(b=>{if(sio&&!reduce){b.textContent='0';sio.observe(b)}else b.textContent=b.dataset.n});
}

/* ---------- Boot ---------- */
applyLang();
Promise.all([fetch('data.json').then(r=>r.json()),fetch('idx.json').then(r=>r.json())]).then(([d,ix])=>{D=d;IDX=ix;D.p.forEach(p=>P[p.id]=p);D.cats.forEach(c=>CAT[c.id]=c);
  addEventListener('hashchange',()=>go());go(true)}).catch(e=>{app.innerHTML='<div class="wrap" style="padding:80px 0"><div class="empty">'+e.message+'</div></div>'});
</script>
