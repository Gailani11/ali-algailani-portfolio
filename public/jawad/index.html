<style>
/* ============================================================================================
   JAWAD v3 — "Showroom" layout
   Identity kept: logo red #ae1f23, warm charcoal, Rubik, products on one stone tile.
   New structure: cinematic full-bleed hero that the header floats over, dark and light bands
   that alternate down the page, numbered editorial sections, branches network, catalogue cover.
   Motion: one reveal rule + Ken Burns banners + page wipe; only transform/opacity animate.
   ============================================================================================ */
:root{
  --paper:#ffffff; --cream:#faf7f4; --stone:#f4f1ef; --blush:#fff9f9;
  --ink:#1f1b1a; --ink-2:#161312; --ink-3:#2a2524; --text:#2c2827; --mute:#716a67; --mute-2:#a59d99;
  --line:#ebe4df; --line-d:rgba(255,255,255,.12);
  --red:#ae1f23; --red-d:#8f181c; --red-wash:rgba(174,31,35,.08);
  --ok:#2f9b62;
  --font:'Rubik','Segoe UI',Tahoma,Arial,sans-serif;
  --ease:cubic-bezier(.22,.8,.12,1);
  --r:24px; --r-s:16px;
  --hh:84px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:110px}
body{margin:0;background:var(--paper);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--ink-2)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
img{display:block;max-width:100%}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:8px}
::selection{background:var(--red);color:#fff}
[hidden]{display:none!important}
.wrap{max-width:1340px;margin-inline:auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}
html[dir=rtl] .flip{transform:scaleX(-1)}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance;font-weight:600;color:var(--ink)}
p{margin:0}
.i{width:20px;height:20px;flex:none}

/* ---------- labels & headings ---------- */
.kicker{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--red);letter-spacing:.14em;text-transform:uppercase}
html[lang=ar] .kicker{letter-spacing:0;font-size:14.5px}
.kicker .n{font-variant-numeric:tabular-nums;color:var(--mute-2);font-weight:500}
.dark .kicker .n{color:rgba(255,255,255,.45)}
.h2{font-size:clamp(30px,3.6vw,52px);font-weight:600;letter-spacing:-.02em;line-height:1.12}
html[lang=ar] .h2{letter-spacing:0;line-height:1.25}
.lead{font-size:clamp(16px,1.25vw,18.5px);color:var(--mute);line-height:1.85}
.sec{padding-block:clamp(72px,9vw,140px)}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:24px 40px;flex-wrap:wrap;margin-bottom:clamp(30px,4vw,56px)}
.sh > div:first-child{display:grid;gap:14px;max-width:720px;min-width:0}
.sh .lead{max-width:560px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:54px;padding-inline:28px;border-radius:999px;font-weight:500;font-size:15.5px;white-space:nowrap;position:relative;overflow:hidden;isolation:isolate;transition:color .4s var(--ease),border-color .4s,background .4s,box-shadow .4s}
.btn svg{width:18px;height:18px;flex:none;transition:transform .45s var(--ease)}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;transform:scaleX(0);transform-origin:right;transition:transform .55s var(--ease)}
html[dir=ltr] .btn::before{transform-origin:left}
.btn-red{background:var(--red);color:#fff;box-shadow:0 14px 30px -14px rgba(174,31,35,.7)}
.btn-red::before{background:var(--ink)}
.btn-ghost{border:1.5px solid var(--line);color:var(--ink);background:#fff}
.btn-ghost::before{background:var(--ink)}
.btn-white{background:#fff;color:var(--ink)}
.btn-white::before{background:var(--ink)}
.btn-glass{border:1.5px solid rgba(255,255,255,.45);color:#fff;background:rgba(255,255,255,.06)}
.btn-glass::before{background:#fff}
@media (hover:hover){
  .btn:hover::before{transform:scaleX(1)}
  .btn-red:hover,.btn-ghost:hover,.btn-white:hover{color:#fff;border-color:var(--ink)}
  .btn-glass:hover{color:var(--ink);border-color:#fff}
  .btn:hover .go{transform:translateX(4px)}
  html[dir=rtl] .btn:hover .go{transform:scaleX(-1) translateX(4px)}
}
html[dir=rtl] .btn .go{transform:scaleX(-1)}
.ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);background:#fff;color:var(--ink);transition:background .35s,color .35s,border-color .35s,transform .35s var(--ease);flex:none}
.ic svg{width:19px;height:19px}
@media (hover:hover){.ic:hover{background:var(--ink);color:#fff;border-color:var(--ink)}}

/* ---------- top bar ---------- */
.topbar{background:var(--ink-2);color:rgba(255,255,255,.78);font-size:13px;position:relative;z-index:61}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;height:40px;flex-wrap:nowrap;overflow:hidden;white-space:nowrap}
.topbar .g{display:flex;align-items:center;gap:22px}
.topbar .g > span{display:inline-flex;align-items:center;gap:8px}
.topbar svg{width:15px;height:15px;opacity:.7}
#st{display:inline-flex;align-items:center;gap:8px}
#st .dot{width:7px;height:7px;border-radius:50%;background:var(--mute-2)}
#st.st-open .dot{background:#3ddc84;box-shadow:0 0 0 4px rgba(61,220,132,.18)}
.langbtn{border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:2px 14px;font-size:12.5px;color:#fff;transition:background .3s}
@media (hover:hover){.langbtn:hover{background:rgba(255,255,255,.12)}}

/* ---------- header (floats over the hero on the home page) ---------- */
header.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:#fff;border-bottom:1px solid var(--line);transition:background .45s,border-color .45s,box-shadow .45s,color .45s}
header.hd .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;height:var(--hh)}
.brand{position:relative;display:block;height:56px;width:94px;flex:none}
.brand img{position:absolute;inset:0;height:100%;width:auto;transition:opacity .45s}
.brand .lw{opacity:0}
nav.mn{display:flex;gap:clamp(20px,2.6vw,42px)}
nav.mn a{position:relative;padding:10px 0;font-weight:500;font-size:15.5px;color:var(--mute);transition:color .3s}
nav.mn a::after{content:"";position:absolute;inset-inline:0;bottom:2px;height:2px;border-radius:2px;background:var(--red);transform:scaleX(0);transition:transform .5s var(--ease)}
nav.mn a.on{color:var(--ink);font-weight:600}
nav.mn a.on::after{transform:scaleX(1)}
@media (hover:hover){nav.mn a:hover{color:var(--ink)} nav.mn a:hover::after{transform:scaleX(.5)}}
.hd-tools{display:flex;align-items:center;gap:10px}
.hd-cat{height:46px;padding-inline:20px;font-size:14.5px}
.burger,.lang-m{display:none}
/* transparent state over the home hero */
body.on-home header.hd:not(.sc){position:fixed;inset-inline:0;top:calc(40px + env(safe-area-inset-top,0px));background:transparent;border-color:transparent;color:#fff}
body.on-home header.hd:not(.sc) .brand .lr{opacity:0}
body.on-home header.hd:not(.sc) .brand .lw{opacity:1}
body.on-home header.hd:not(.sc) nav.mn a{color:rgba(255,255,255,.78)}
body.on-home header.hd:not(.sc) nav.mn a.on{color:#fff}
body.on-home header.hd:not(.sc) .ic{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.35);color:#fff}
body.on-home header.hd.sc{position:fixed;inset-inline:0;top:env(safe-area-inset-top,0px);box-shadow:0 10px 30px -18px rgba(0,0,0,.25);animation:hdIn .5s var(--ease)}
@keyframes hdIn{from{transform:translateY(-100%)}to{transform:none}}
body.on-home main{margin-top:0}

/* ---------- drawer (phones) ---------- */
.drawer{position:fixed;inset:0;z-index:80;background:var(--ink-2);color:#fff;display:grid;grid-template-rows:auto 1fr auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));transform:translateY(-102%);visibility:hidden;transition:transform .7s var(--ease),visibility 0s .7s;overflow-y:auto;overscroll-behavior:contain}
.drawer.open{transform:none;visibility:visible;transition:transform .7s var(--ease)}
.drawer .top{display:flex;justify-content:space-between;align-items:center}
.drawer .top img{height:48px}
.drawer .ic{background:transparent;border-color:rgba(255,255,255,.3);color:#fff}
.dnav{display:grid;align-content:center;gap:2px;counter-reset:dn}
.dnav a{font-size:32px;font-weight:600;padding:14px 0;border-bottom:1px solid var(--line-d);display:flex;align-items:baseline;gap:16px;opacity:0;transform:translateY(18px);transition:opacity .5s,transform .6s var(--ease),color .3s}
.dnav a::before{counter-increment:dn;content:"0" counter(dn);font-size:13px;color:rgba(255,255,255,.4);font-weight:500;font-variant-numeric:tabular-nums}
.drawer.open .dnav a{opacity:1;transform:none}
.drawer.open .dnav a:nth-child(2){transition-delay:.06s}.drawer.open .dnav a:nth-child(3){transition-delay:.12s}.drawer.open .dnav a:nth-child(4){transition-delay:.18s}
.dnav a.on{color:#ff6b6f}
.dfoot{display:grid;gap:10px;color:rgba(255,255,255,.6);font-size:14px}
.dfoot .btn{justify-self:start}
@media (max-height:560px){.dnav{align-content:start;padding-block:10px}.dnav a{font-size:21px;padding:8px 0}}

/* ---------- search overlay ---------- */
.so{position:fixed;inset:0;z-index:85;background:rgba(255,255,255,.985);display:grid;grid-template-rows:auto 1fr;padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 20px max(20px,env(safe-area-inset-left,0px));opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s}
.so.open{opacity:1;visibility:visible}
.so .bar{max-width:900px;width:100%;margin-inline:auto;display:flex;gap:12px;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:12px;transform:translateY(14px);transition:transform .6s var(--ease)}
.so.open .bar{transform:none}
.so input{flex:1;min-width:0;border:0;outline:0;font-size:clamp(20px,3vw,32px);background:transparent}
.so .list{max-width:900px;width:100%;margin-inline:auto;overflow:auto;padding-top:18px;display:grid;gap:4px;align-content:start}
.so .it{display:flex;align-items:center;gap:16px;padding:10px;border-radius:14px;transition:background .25s}
.so .it .ph{width:64px;flex:none;border-radius:12px}
.so .it b{font-weight:500;display:block;line-height:1.5}
.so .it small{color:var(--mute)}
@media (hover:hover){.so .it:hover{background:var(--stone)}}
.so .hint{display:flex;align-items:center;gap:10px;color:var(--mute);padding:14px 4px}
.so .hint svg{width:20px;height:20px}

/* ---------- curtain (first load) + page wipe (between pages) ---------- */
.curtain{position:fixed;inset:0;z-index:100;pointer-events:none;display:grid;place-items:center;background:var(--ink-2);opacity:0;visibility:hidden}
.curtain img{width:132px;opacity:0}
.curtain.intro{opacity:1;visibility:visible;animation:introOut .8s var(--ease) 1.15s forwards}
.curtain.intro img{animation:logoIn .9s var(--ease) .1s forwards}
@keyframes introOut{to{opacity:0;visibility:hidden;transform:translateY(-4%)}}
@keyframes logoIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.wipe{position:fixed;inset:0;z-index:99;pointer-events:none;background:var(--red);transform:translateY(101%);display:grid;place-items:center;visibility:hidden}
.wipe.in{visibility:visible}
.wipe img{width:110px;opacity:0;transition:opacity .25s}
.wipe.in{transition:transform .5s cubic-bezier(.7,0,.3,1);transform:none}
.wipe.in img{opacity:1;transition-delay:.25s}
.wipe.out{transition:transform .65s cubic-bezier(.7,0,.3,1);transform:translateY(-101%)}

/* ---------- reveal (one rule for everything) ---------- */
.rv{opacity:0;transform:translate3d(0,40px,0);transition:opacity 1s cubic-bezier(.22,.61,.36,1) var(--d,0s),transform 1.15s cubic-bezier(.22,.61,.36,1) var(--d,0s)}
.rv.in{opacity:1;transform:none}
.rv-img{position:relative;overflow:hidden}
.rv-img::after{content:"";position:absolute;inset:0;background:var(--cv,var(--cream));transform-origin:left;transition:transform 1.25s cubic-bezier(.77,0,.18,1) var(--d,0s);z-index:3}
html[dir=rtl] .rv-img::after{transform-origin:right}
.rv-img.in::after{transform:scaleX(0)}
.rv-img > img{transform:scale(1.18);transition:transform 1.8s cubic-bezier(.22,.61,.36,1) var(--d,0s)}
.rv-img.in > img{transform:none}

/* ============================== HOME ============================== */
/* hero: full-bleed banner slider, header floats on top */
.hero{position:relative;height:max(600px,min(100svh - 40px,900px));color:#fff;overflow:hidden;background:var(--ink-2);isolation:isolate}
.slides{position:absolute;inset:0;z-index:0}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.4s cubic-bezier(.4,0,.2,1)}
.slide.on{opacity:1;z-index:2}
.slide.leaving{opacity:1;z-index:1;transition:none}
.slide .im{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--fp,50% 60%);transform:scale(1.16);will-change:transform}
.slide.on .im{animation:kb 8.5s cubic-bezier(.2,.6,.3,1) forwards}
.slide.leaving .im{transform:scale(1)}
@keyframes kb{from{transform:scale(1.16)}to{transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(to left,rgba(14,10,10,.82) 0%,rgba(14,10,10,.62) 34%,rgba(14,10,10,.18) 68%,rgba(14,10,10,.1) 100%),linear-gradient(to top,rgba(14,10,10,.7) 0%,rgba(14,10,10,0) 38%)}
html[dir=ltr] .hero::after{background:linear-gradient(to right,rgba(14,10,10,.82) 0%,rgba(14,10,10,.62) 34%,rgba(14,10,10,.18) 68%,rgba(14,10,10,.1) 100%),linear-gradient(to top,rgba(14,10,10,.7) 0%,rgba(14,10,10,0) 38%)}
.hero .wrap{position:relative;z-index:5;height:100%;display:grid;grid-template-rows:1fr auto;padding-top:calc(var(--hh) + 30px)}
.hero-copy{align-self:center;display:grid;gap:22px;max-width:860px;min-width:0;padding-bottom:20px}
.hero-copy .kicker{color:#fff;opacity:.85}
.hero-copy .kicker::before{content:"";width:34px;height:2px;background:var(--red);border-radius:2px}
.hero h1{white-space:nowrap;font-size:clamp(34px,5.6vw,92px);font-weight:700;letter-spacing:-.025em;line-height:1.05;color:#fff}
html[lang=ar] .hero h1{letter-spacing:0;line-height:1.2}
.hero h1 em{font-style:normal;color:#ff4a50}
.hero h1.two{white-space:normal;text-wrap:balance}
.hero .lead{color:rgba(255,255,255,.82);max-width:560px;text-wrap:pretty}
.hero .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
/* slider controls: collection tabs */
.slider{position:relative;z-index:5;display:grid;grid-template-columns:auto 1fr;align-items:end;gap:26px;padding-bottom:clamp(22px,3vw,40px)}
.hero-ui{display:flex;align-items:center;gap:12px}
.hero-ui .ic{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.35);color:#fff;width:50px;height:50px}
@media (hover:hover){.hero-ui .ic:hover{background:#fff;color:var(--ink);border-color:#fff}}
.counter{font-size:14px;color:rgba(255,255,255,.8);min-width:62px;text-align:center}
.counter b{color:#fff;font-weight:600;font-size:18px}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;min-width:0}
.tab{display:grid;gap:4px;text-align:start;padding-top:16px;position:relative;color:rgba(255,255,255,.6);transition:color .4s;min-width:0}
.tab::before{content:"";position:absolute;inset-inline:0;top:0;height:2px;background:rgba(255,255,255,.22)}
.tab i{position:absolute;inset-inline-start:0;top:0;height:2px;width:100%;background:#fff;transform:scaleX(0);transform-origin:left}
html[dir=rtl] .tab i{transform-origin:right}
.tab.on i{animation:fillbar 7s linear forwards}
.tab.done i{transform:scaleX(1)}
@keyframes fillbar{to{transform:scaleX(1)}}
.tab small{font-size:12.5px;font-variant-numeric:tabular-nums;opacity:.8}
.tab b{font-weight:600;font-size:16px;color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab span{font-size:13px;opacity:.75}
.tab.on{color:#fff}
@media (hover:hover){.tab:hover{color:#fff}}
.scroll-cue{position:absolute;inset-inline-end:max(20px,calc((100vw - 1340px)/2 + 20px));bottom:calc(100% + 26px);display:none}

/* red marquee ribbon */
.ribbon{background:var(--red);color:#fff;overflow:hidden;position:relative;z-index:2}
.ribbon .mq{display:flex;gap:46px;width:max-content;padding-block:18px;animation:mq 38s linear infinite;font-size:clamp(17px,1.6vw,22px);font-weight:500;white-space:nowrap}
.ribbon .mq span{display:inline-flex;align-items:center;gap:46px}
.ribbon .mq span::after{content:"✦";font-size:.7em;opacity:.6}
html[dir=rtl] .ribbon .mq{animation-name:mqr}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes mqr{to{transform:translateX(50%)}}

/* intro: statement + numbers + image */
.intro{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(36px,6vw,96px);align-items:center}
.intro .stmt{font-size:clamp(22px,2.4vw,34px);line-height:1.6;color:var(--ink);font-weight:400;text-wrap:pretty}
html[lang=en] .intro .stmt{line-height:1.45}
.intro .stmt b{color:var(--red);font-weight:500}
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--line);margin-top:clamp(28px,3vw,44px)}
.figs > div{padding:22px 4px 0;display:grid;gap:2px;border-inline-start:1px solid var(--line);padding-inline-start:18px}
.figs > div:first-child{border-inline-start:0;padding-inline-start:0}
.figs b{font-size:clamp(34px,3.6vw,54px);font-weight:600;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums}
.figs span{color:var(--mute);font-size:14.5px}
.intro .pic{border-radius:var(--r);aspect-ratio:4/5;overflow:hidden;position:relative}
.intro .pic img{width:100%;height:100%;object-fit:cover}
.intro .pic .badge{position:absolute;z-index:4;inset-inline-start:22px;bottom:22px;background:#fff;border-radius:18px;padding:14px 18px;display:flex;gap:12px;align-items:center;box-shadow:0 20px 40px -20px rgba(0,0,0,.35)}
.badge .bi{width:42px;height:42px;border-radius:12px;background:var(--red-wash);color:var(--red);display:grid;place-items:center}
.badge b{display:block;color:var(--ink);font-weight:600;line-height:1.3}
.badge span{font-size:13px;color:var(--mute)}

/* featured categories: numbered editorial cards */
.feat{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px}
.fc{position:relative;display:grid;grid-template-rows:1fr auto;border-radius:var(--r);background:var(--stone);overflow:hidden;min-height:290px;isolation:isolate;min-width:0}
.fc:nth-child(1){grid-column:span 3;grid-row:span 2;background:var(--blush)}
.fc:nth-child(2),.fc:nth-child(3){grid-column:span 3}
.fc:nth-child(4),.fc:nth-child(5){grid-column:span 3}
.fc .no{position:absolute;top:22px;inset-inline-start:24px;font-size:13px;font-weight:600;color:var(--mute-2);font-variant-numeric:tabular-nums;z-index:2}
.fc .imgs{display:grid;place-items:center;padding:52px 28px 14px;min-height:0}
.fc .imgs .row{display:flex;align-items:flex-end;justify-content:center;gap:6%;width:100%}
.fc .imgs img{flex:1 1 0;min-width:0;max-width:44%;max-height:190px;height:auto;object-fit:contain;object-position:center bottom;opacity:0;transition:opacity .6s,transform .9s var(--ease)}
.fc:nth-child(1) .imgs{padding:70px 36px 20px}
.fc:nth-child(1) .imgs .row{gap:5%}
.fc:nth-child(1) .imgs img{max-width:30%;max-height:360px}
.fc .imgs img.ld{opacity:1}
.fc .tx{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:0 26px 24px}
.fc .tx div{display:grid;gap:2px;min-width:0}
.fc b{font-size:clamp(19px,1.6vw,24px);font-weight:600;color:var(--ink);line-height:1.3}
.fc:nth-child(1) b{font-size:clamp(26px,2.6vw,38px)}
.fc .tx span{color:var(--mute);font-size:14px}
.fc .go{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;transition:background .4s,color .4s,transform .5s var(--ease)}
.fc .go svg{width:18px;height:18px}
html[dir=rtl] .fc .go svg{transform:scaleX(-1)}
@media (hover:hover){.fc:hover .go{background:var(--red);color:#fff;transform:rotate(-45deg)} html[dir=rtl] .fc:hover .go{transform:rotate(45deg)} .fc:hover .imgs img{transform:translateY(-8px) scale(1.04)}}

/* materials: dark band */
.dark{background:var(--ink);color:rgba(255,255,255,.75)}
.dark h2,.dark .h2{color:#fff}
.dark .lead{color:rgba(255,255,255,.62)}
.dark .btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.dark .btn-ghost::before{background:#fff}
@media (hover:hover){.dark .btn-ghost:hover{color:var(--ink);border-color:#fff}}
.mats{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:14px}
.mat{display:grid;justify-items:center;gap:14px;padding:22px 8px 20px;border-radius:var(--r);border:1px solid var(--line-d);text-align:center;transition:background .45s,border-color .45s;min-width:0}
.mat .disc{position:relative;width:100%;max-width:120px;aspect-ratio:1;border-radius:50%;background:var(--stone);display:grid;place-items:center;overflow:hidden}
.mat .disc img{width:70%;height:70%;object-fit:contain;transition:transform .8s var(--ease)}
.mat .disc .grid4{display:grid;grid-template-columns:repeat(2,18px);gap:6px}
.mat .disc .grid4 span{width:18px;height:18px;border-radius:5px;background:var(--red)}
.mat .disc .grid4 span:nth-child(2),.mat .disc .grid4 span:nth-child(3){background:var(--ink)}
.mat b{color:#fff;font-weight:600;font-size:16px}
.mat small{color:rgba(255,255,255,.5);font-size:13px;margin-top:-10px}
@media (hover:hover){.mat:hover{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.3)} .mat:hover .disc img{transform:scale(1.12) rotate(-5deg)}}

/* product cards + rail */
.pc{position:relative;display:grid;gap:14px;min-width:0;color:var(--ink)}
.ph{position:relative;aspect-ratio:1/1;border-radius:var(--r-s);background:var(--stone);overflow:hidden;display:grid;place-items:center}
.ph img{width:76%;height:76%;object-fit:contain;opacity:0;transition:opacity .5s,transform .9s var(--ease)}
.ph img.ld{opacity:1}
.ph::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 0 var(--red);transition:box-shadow .4s;pointer-events:none}
.ph .go{position:absolute;bottom:12px;inset-inline-end:12px;width:40px;height:40px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;transform:scale(.4);opacity:0;transition:transform .45s var(--ease),opacity .3s}
.ph .go svg{width:17px;height:17px}
html[dir=rtl] .ph .go svg{transform:scaleX(-1)}
.ph .new{position:absolute;top:12px;inset-inline-start:12px;background:var(--red);color:#fff;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;z-index:2}
@media (hover:hover){.pc:hover .ph img{transform:scale(1.07)} .pc:hover .ph::after{box-shadow:inset 0 0 0 1.5px var(--red)} .pc:hover .ph .go{transform:none;opacity:1}}
.pm{display:grid;gap:4px;min-width:0}
.pm small{color:var(--red);font-size:12.5px;font-weight:500}
.pm h4{font-size:15.5px;font-weight:500;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.psp{display:inline-flex;align-items:center;gap:6px;color:var(--mute);font-size:13px}
.psp svg{width:14px;height:14px}
.rail-ctl{display:flex;gap:10px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(230px,22%,300px);gap:22px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:6px;overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.rail .pc{scroll-snap-align:start}
.rail.drag{scroll-snap-type:none;cursor:grabbing}
.track{height:2px;background:var(--line);border-radius:2px;margin-top:26px;overflow:hidden}
.track i{display:block;height:100%;background:var(--red);border-radius:2px;transition:transform .2s}

/* made locally: full-bleed parallax band */
.made{position:relative;min-height:clamp(560px,52vw,760px);display:grid;align-items:center;overflow:hidden;color:#fff;isolation:isolate}
.made .bg{position:absolute;inset:-12% 0;z-index:-2}
.made .bg img{width:100%;height:100%;object-fit:cover;will-change:transform}
.made::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to left,rgba(14,10,10,.85),rgba(14,10,10,.55) 55%,rgba(14,10,10,.2))}
html[dir=ltr] .made::before{background:linear-gradient(to right,rgba(14,10,10,.85),rgba(14,10,10,.55) 55%,rgba(14,10,10,.2))}
.made .box{max-width:640px;display:grid;gap:22px;padding-block:80px}
.made h2{color:#fff}
.made h2 span{display:block;color:#ff6066}
.made .lead{color:rgba(255,255,255,.78)}
.feats{display:grid;gap:12px;margin-top:6px}
.feats div{display:flex;align-items:center;gap:14px;font-weight:500;color:#fff}
.feats .fi{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;flex:none}

/* sectors */
.sectors{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sector{display:grid;justify-items:center;gap:16px;padding:34px 10px;text-align:center;border-inline-start:1px solid var(--line);transition:background .45s}
.sector:first-child{border-inline-start:0}
.sector .icw{width:76px;height:76px;border-radius:50%;background:var(--red-wash);display:grid;place-items:center;transition:transform .7s var(--ease),background .45s}
.sector .icw img{width:40px;height:40px}
.sector b{font-weight:600;color:var(--ink);font-size:16.5px}
@media (hover:hover){.sector:hover{background:var(--cream)} .sector:hover .icw{transform:translateY(-6px)}}

/* branches network */
.net{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(30px,5vw,80px);align-items:start}
.blist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.br{position:relative;display:grid;gap:4px;padding:20px 20px 18px;border-radius:var(--r-s);background:#fff;border:1px solid var(--line);transition:border-color .4s,transform .5s var(--ease),box-shadow .4s;min-width:0}
.br::before{content:"";position:absolute;top:22px;inset-inline-end:18px;width:9px;height:9px;border-radius:50%;background:var(--mute-2)}
.br.hq{background:var(--ink);border-color:var(--ink)}
.br.hq::before{background:var(--red);box-shadow:0 0 0 5px rgba(174,31,35,.25)}
.br.wh::before{background:var(--red)}
.br b{font-size:17px;font-weight:600;color:var(--ink);line-height:1.35}
.br.hq b{color:#fff}
.br span{font-size:13.5px;color:var(--mute)}
.br.hq span{color:rgba(255,255,255,.6)}
@media (hover:hover){a.br:hover{border-color:var(--red);transform:translateY(-4px);box-shadow:0 18px 34px -24px rgba(0,0,0,.4)}}
.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--mute);font-size:13.5px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--mute-2)}
.legend i.r{background:var(--red)}

/* brands */
.brands{overflow:hidden;border-block:1px solid var(--line);padding-block:30px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.brands .mq{display:flex;align-items:center;gap:90px;width:max-content;animation:mq 34s linear infinite}
html[dir=rtl] .brands .mq{animation-name:mqr}
.brands img{height:54px;width:auto;opacity:.85;filter:grayscale(.2);transition:opacity .3s,filter .3s}
@media (hover:hover){.brands img:hover{opacity:1;filter:none}}

/* catalogue CTA with the real cover */
.cta{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:30px;align-items:center;border-radius:calc(var(--r) + 8px);background:var(--red);color:#fff;padding:clamp(34px,5vw,72px);overflow:hidden;isolation:isolate}
.cta::before{content:"";position:absolute;width:620px;height:620px;border-radius:50%;border:90px solid rgba(255,255,255,.06);inset-inline-end:-200px;top:-260px;z-index:-1}
.cta h2{color:#fff}
.cta p{color:rgba(255,255,255,.85);max-width:520px}
.cta .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.cta .cover{justify-self:center;position:relative;width:min(300px,100%);perspective:1200px}
.cta .cover img{width:100%;border-radius:6px;box-shadow:0 40px 60px -30px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.1);transform:rotateY(-14deg) rotateX(4deg) rotate(2deg);transition:transform 1s var(--ease)}
html[dir=ltr] .cta .cover img{transform:rotateY(14deg) rotateX(4deg) rotate(-2deg)}
@media (hover:hover){.cta:hover .cover img{transform:none}}
.cta .cover::after{content:"PDF";position:absolute;top:-14px;inset-inline-end:-14px;background:#fff;color:var(--red);font-weight:700;font-size:13px;padding:8px 12px;border-radius:999px;box-shadow:0 10px 20px -10px rgba(0,0,0,.4)}

/* ============================== INNER PAGES ============================== */
.pagehead{position:relative;background:var(--ink);color:#fff;overflow:hidden;isolation:isolate}
.pagehead .wrap{padding-block:clamp(56px,7vw,110px) clamp(40px,5vw,72px);display:grid;gap:16px}
.pagehead::before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;border:80px solid rgba(255,255,255,.04);inset-inline-end:-160px;top:-240px;z-index:-1}
.pagehead h1{color:#fff;font-size:clamp(36px,5vw,72px);font-weight:600;letter-spacing:-.02em}
html[lang=ar] .pagehead h1{letter-spacing:0}
.pagehead .pc-n{color:rgba(255,255,255,.6);font-size:15px}
.crumb{display:flex;align-items:center;gap:8px;font-size:14px;color:rgba(255,255,255,.6);flex-wrap:wrap}
.crumb svg{width:14px;height:14px;opacity:.6}
html[dir=rtl] .crumb svg{transform:scaleX(-1)}
.crumb a{transition:color .3s}
@media (hover:hover){.crumb a:hover{color:#fff}}
.crumb span{color:#fff}
.pagehead.img .bgi{position:absolute;inset:0;z-index:-2}
.pagehead.img .bgi img{width:100%;height:100%;object-fit:cover;animation:kb 9s cubic-bezier(.2,.6,.3,1) forwards}
.pagehead.img::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(14,10,10,.85),rgba(14,10,10,.45))}
.pagehead.img .wrap{padding-block:clamp(120px,14vw,220px) clamp(44px,5vw,80px)}

/* products page */
.shop{display:grid;grid-template-columns:280px minmax(0,1fr);gap:clamp(24px,3vw,48px);padding-block:clamp(30px,4vw,54px) 100px;align-items:start}
.side{position:sticky;top:calc(var(--hh) + 20px + env(safe-area-inset-top,0px));display:grid;gap:14px;min-height:0}
.side .box{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr);max-height:calc(100vh - var(--hh) - 44px - env(safe-area-inset-top,0px));background:#fff}
.side h3{font-size:16px;padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.side h3 .hi{display:inline-flex;align-items:center;gap:10px}
.side h3 svg{width:18px;height:18px;color:var(--red)}
.side h3 small{color:var(--mute);font-weight:400}
.catlist{overflow:auto;padding:8px;display:grid;gap:2px;scrollbar-width:thin;align-content:start}
.catlist button{display:flex;justify-content:space-between;gap:10px;text-align:start;padding:10px 14px;border-radius:12px;font-size:14px;color:#4a4443;transition:background .25s,color .25s}
.catlist button small{color:var(--mute-2);font-size:12px;font-variant-numeric:tabular-nums}
@media (hover:hover){.catlist button:hover{background:var(--stone);color:var(--ink)}}
.catlist button.on{background:var(--ink);color:#fff}
.catlist button.on small{color:rgba(255,255,255,.65)}
.toolbar{position:sticky;top:calc(var(--hh) + env(safe-area-inset-top,0px));z-index:20;background:rgba(255,255,255,.97);padding-block:14px;display:grid;gap:12px;border-bottom:1px solid var(--line);margin-bottom:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;height:40px;padding-inline:16px;border-radius:999px;border:1px solid var(--line);font-size:14px;background:#fff;transition:background .3s,color .3s,border-color .3s;white-space:nowrap}
.chip small{color:var(--mute-2);font-size:12px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.chip.on small{color:rgba(255,255,255,.75)}
@media (hover:hover){.chip:hover{border-color:var(--ink)}}
.tb-row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sbox{flex:1;max-width:420px;min-width:220px;display:flex;align-items:center;gap:10px;height:46px;border:1px solid var(--line);border-radius:999px;padding-inline:16px;background:#fff;transition:border-color .3s}
.sbox:focus-within{border-color:var(--ink)}
.sbox svg{width:18px;height:18px;color:var(--mute);flex:none}
.sbox input{border:0;outline:0;flex:1;min-width:0;background:transparent;font-size:14.5px}
.res{display:inline-flex;align-items:center;gap:8px;color:var(--mute);font-size:14px}
.res svg{width:16px;height:16px;color:var(--red)}
.res b{color:var(--ink)}
.mob-cats{display:none}
.mob-cats select{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);padding-inline:14px;background:#fff;color:var(--ink)}
.group{padding-top:30px}
.group > h3{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:600;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.group > h3 svg{width:18px;height:18px;color:var(--red)}
.group > h3 small{margin-inline-start:auto;color:var(--mute-2);font-size:13px;font-weight:400;font-variant-numeric:tabular-nums}
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:30px 20px}
.empty{display:grid;justify-items:center;gap:12px;padding:70px 20px;color:var(--mute);text-align:center}
.empty svg{width:34px;height:34px;color:var(--mute-2)}

/* product page */
.pd{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(30px,5vw,80px);padding-block:clamp(30px,4vw,60px) 40px;align-items:start}
.pd .gal{position:sticky;top:calc(var(--hh) + 24px + env(safe-area-inset-top,0px));display:grid;gap:14px}
.pd #zoom{border-radius:var(--r);cursor:zoom-in}
.pd #zoom img{width:78%;height:78%;transition:transform .5s var(--ease),opacity .5s}
@media (hover:hover){.pd #zoom:hover img{transform:scale(1.7)}}
.pd .gal .note{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13px}
.pd .gal .note svg{width:16px;height:16px}
.pd-info{display:grid;gap:22px;min-width:0}
.pd-info .crumb{color:var(--mute)}
.pd-info .crumb span,.pd-info .crumb a{color:var(--mute)}
@media (hover:hover){.pd-info .crumb a:hover{color:var(--red)}}
.pd-info h1{font-size:clamp(26px,2.8vw,40px);font-weight:600;line-height:1.35}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;height:34px;padding-inline:14px;border-radius:999px;background:var(--stone);font-size:13.5px;color:var(--ink)}
.tag.g{background:var(--red-wash);color:var(--red)}
.spec{border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden}
.spec > div{display:grid;grid-template-columns:minmax(120px,.8fr) minmax(0,1.2fr);gap:16px;padding:15px 20px;align-items:center}
.spec > div:nth-child(odd){background:var(--cream)}
.spec span{display:inline-flex;align-items:center;gap:10px;color:var(--mute);font-size:14.5px}
.spec span svg{width:17px;height:17px;color:var(--red)}
.spec b{font-weight:500;color:var(--ink);overflow-wrap:anywhere}
.pd-info .row{display:flex;gap:12px;flex-wrap:wrap}
.copied{font-size:13px;color:var(--ok);min-height:20px}
.pnav{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid var(--line);padding-top:22px}
.pnav a{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;border:1px solid var(--line);transition:border-color .3s;min-width:0}
.pnav a .ph{width:60px;flex:none;border-radius:12px}
.pnav a div{display:grid;min-width:0}
.pnav small{color:var(--mute);font-size:12px}
.pnav b{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pnav .nx{justify-content:flex-end;text-align:end}
.pnav .nx .ph{order:2}
@media (hover:hover){.pnav a:hover{border-color:var(--red)}}

/* about page */
.story{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(36px,6vw,96px);align-items:start}
.story .pic{position:sticky;top:calc(var(--hh) + 30px);border-radius:var(--r);aspect-ratio:4/5;overflow:hidden}
.story .pic img{width:100%;height:100%;object-fit:cover}
.story .txt{display:grid;gap:30px}
.story .first{font-size:clamp(21px,2.1vw,30px);line-height:1.65;color:var(--ink);text-wrap:pretty}
html[lang=en] .story .first{line-height:1.45}
.story .para{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;padding-top:26px;border-top:1px solid var(--line)}
.story .para .api{width:48px;height:48px;border-radius:14px;background:var(--red-wash);color:var(--red);display:grid;place-items:center}
.story .para p{color:var(--mute);font-size:16.5px;line-height:1.9}

/* contact page */
.cgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:calc(-1 * clamp(30px,3vw,48px));position:relative;z-index:3}
.cc{position:relative;display:grid;align-content:start;gap:12px;border-radius:var(--r);background:#fff;border:1px solid var(--line);padding:24px;min-width:0;box-shadow:0 24px 50px -36px rgba(0,0,0,.35);transition:border-color .3s}
.cc .icw{width:48px;height:48px;border-radius:14px;background:var(--red-wash);color:var(--red);display:grid;place-items:center}
.cc .icw svg{width:22px;height:22px}
.cc > span:not(.icw){color:var(--mute);font-size:13.5px}
.cc b{font-weight:600;font-size:18px;color:var(--ink);white-space:nowrap}
.cc .cp{position:absolute;top:20px;inset-inline-end:20px;font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;transition:border-color .3s}
@media (hover:hover){.cc .cp:hover{border-color:var(--ink)} .cc:hover{border-color:var(--red)}}
.hrs{display:grid;gap:6px;font-size:14.5px}
.hrs div{display:flex;justify-content:space-between;flex-wrap:wrap;gap:0 12px}
.hrs div > b{font-size:14.5px;font-weight:500;white-space:normal}
.hrs em{font-style:normal;color:var(--mute);white-space:nowrap}
.branches{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(24px,3vw,40px);align-items:start}
.acc{display:grid;gap:10px}
.acc .item{border:1px solid var(--line);border-radius:var(--r-s);background:#fff;overflow:hidden;transition:border-color .3s,box-shadow .3s}

function setImg(el){const id=el.dataset.pid,tn=el.dataset.tint||'';if(!id)return;
  const src=window.__IMG?window.__IMG[tn+id]:(tn?'img/b/':'img/')+id+'.webp';if(!src)return;
  el.decoding='async';el.onload=()=>el.classList.add('ld');el.src=src;if(el.complete&&el.naturalWidth)el.classList.add('ld')}
const io=('IntersectionObserver' in window)?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);setImg(e.target)}}),{rootMargin:'600px'}):null;

function parse(){const h=(location.hash||'#home').slice(1);
  if(h.startsWith('p-'))return{r:'product',id:+h.slice(2)};
  if(h.startsWith('products')){const m=h.match(/^products-([ct])(\d+)$/);
    /* unknown category / material links fall back to all products instead of breaking */
    const ok=m&&(m[1]==='c'?!!CAT[+m[2]]:TAGS.some(g=>g.id===+m[2]));
    return{r:'products',f:ok?{[m[1]==='c'?'cat':'tag']:+m[2]}:(m?{cat:0,tag:0}:null)}}
  if(['about','contact','home','latest','branches'].includes(h))return{r:h==='latest'?'home':h==='branches'?'contact':h,anchor:h==='latest'||h==='branches'?h:null};return{r:'home'}}
/* page change: a red panel with the logo sweeps up over the old page, the new page is drawn behind it,
   then the panel continues upward and the new page rises in piece by piece */
const wipe=document.getElementById('wipe');let busy=false;
function go(first){const R=parse();clearInterval(slideTimer);
  const swap=()=>{render(R);if(R.anchor){setTimeout(()=>{const a=document.getElementById(R.anchor);if(a)scrollTo({top:a.getBoundingClientRect().top+scrollY-90})},60)}else if(!first)scrollTo(0,0)};
  if(first||reduce){swap();return}
  if(busy){swap();return}busy=true;
  wipe.className='wipe in';
  setTimeout(()=>{swap();wipe.className='wipe in out';setTimeout(()=>{wipe.className='wipe';busy=false},700)},520);
}
function setNav(r){document.querySelectorAll('[data-r]').forEach(a=>a.classList.toggle('on',a.dataset.r===(r==='product'?'products':r)))}
function render(R){route=R.r;setNav(R.r);document.body.classList.toggle('on-home',R.r==='home');hdUpd();
  if(R.r==='home')app.innerHTML=homeHTML();
  if(R.r==='products'){if(R.f){state.cat=R.f.cat||0;state.tag=R.f.tag||0;state.q=''}app.innerHTML=productsHTML();bindProducts()}
  if(R.r==='product')app.innerHTML=productHTML(R.id);
  if(R.r==='about')app.innerHTML=aboutHTML();
  if(R.r==='contact'){app.innerHTML=contactHTML();bindContact()}
  if(R.r==='home')bindHome();
  if(R.r==='product'){bindProduct(R.id);bindRail()}
  if(R.r==='about')bindRail();
  hydrate(app);motion(R.r);hdUpd();waUpd();

/* hero title on one line: shrink to fit; on narrow phones let it take two balanced lines */
function fitHero(){const h=document.getElementById('heroT');if(!h)return;
  h.classList.remove('two');h.style.fontSize='';const max=parseFloat(getComputedStyle(h).fontSize);
  const avail=h.parentElement.clientWidth;const r=document.createRange();r.selectNodeContents(h);const w=r.getBoundingClientRect().width;
  const fs=Math.min(96,max*avail/w*.985);
  if(fs>=(L==='ar'?30:32)){h.style.fontSize=Math.min(fs,max*1.25).toFixed(2)+'px';return}
  h.classList.add('two');const lines=()=>{const s=new Set();for(const q of r.getClientRects())if(q.width>1)s.add(Math.round(q.top/4));return s.size};
  let f=46;h.style.fontSize=f+'px';r.selectNodeContents(h);while(f>28&&lines()>2){f-=1;h.style.fontSize=f+'px';r.selectNodeContents(h)}
  if(lines()>2)h.style.fontSize='34px'}
addEventListener('resize',()=>{if(route==='home')fitHero()});
function bindHome(){fitHero();document.fonts&&document.fonts.ready.then(fitHero);
  const sl=[...document.querySelectorAll('.slide')],tabs=[...document.querySelectorAll('.tab')],cnt=document.getElementById('cnt');let i=0;
  const show=n=>{n=(n+sl.length)%sl.length;if(n===i)return;const prev=sl[i];prev.classList.remove('on');prev.classList.add('leaving');setTimeout(()=>prev.classList.remove('leaving'),1500);
    i=n;sl[i].classList.add('on');
    /* restart the zoom on the incoming banner */
    const im=sl[i].querySelector('.im');im.style.animation='none';void im.offsetWidth;im.style.animation='';
    tabs.forEach((b,k)=>{b.classList.remove('on');void b.offsetWidth;b.classList.toggle('on',k===i);b.classList.toggle('done',k<i)});
    cnt.innerHTML=`<b>${two(i+1)}</b> / ${two(sl.length)}`};
  const restart=()=>{clearInterval(slideTimer);if(!reduce)slideTimer=setInterval(()=>show(i+1),7000)};
  document.getElementById('hPrev').onclick=()=>{show(i-1);restart()};document.getElementById('hNext').onclick=()=>{show(i+1);restart()};
  tabs.forEach((b,k)=>b.addEventListener('click',()=>{if(k===i){location.hash=slideInfo(SLIDES[k]).href.slice(1);return}show(k);restart()}));
  sl.forEach((s,k)=>s.addEventListener('click',()=>location.hash=slideInfo(SLIDES[k]).href.slice(1)));
  /* swipe on touch */
  let sx=null;const hero=document.getElementById('hero');
  hero.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
  hero.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>50){show(i+((dx<0)===(L==='ar')?-1:1));restart()}},{passive:true});
  restart();bindRail();
  document.querySelectorAll('a.br').forEach(a=>a.addEventListener('click',()=>{try{sessionStorage.setItem('jawad-br',a.dataset.bi)}catch(e){}}));
}
function bindRail(){document.querySelectorAll('.rail').forEach(rail=>{
  const trk=rail.parentElement.querySelector('.track i');
  const upd=()=>{if(!trk)return;const max=rail.scrollWidth-rail.clientWidth,w=rail.clientWidth/rail.scrollWidth,p=max>0?Math.abs(rail.scrollLeft)/max:0;trk.style.width=(w*100)+'%';trk.style.transform=`translateX(${(L==='ar'?-1:1)*p*(1-w)/w*100}%)`};
  rail.addEventListener('scroll',upd,{passive:true});upd();
  const step=()=>(rail.querySelector('.pc')?.offsetWidth||260)*2+44;
  document.querySelectorAll(`[data-rail="${rail.id}"]`).forEach(b=>b.onclick=()=>rail.scrollBy({left:(L==='ar'?-1:1)*(+b.dataset.dir)*step(),behavior:'smooth'}));
  let down=false,sx=0,sl0=0,moved=false;
  rail.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;down=true;moved=false;sx=e.clientX;sl0=rail.scrollLeft});
  addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-sx;if(Math.abs(dx)>5){moved=true;rail.classList.add('drag')}rail.scrollLeft=sl0-dx});
  addEventListener('pointerup',()=>{if(!down)return;down=false;rail.classList.remove('drag')});
  rail.addEventListener('click',e=>{if(moved){e.preventDefault();moved=false}},true)})}

let pRendered=0,pList=[],pObs=null;
function matchQ(p,q){return !q||(p.t+' '+p.te+' '+p.s+' '+p.se+' '+p.sp.map(s=>s[1]).join(' ')).toLowerCase().includes(q)}
function filtered(){const q=state.q.trim().toLowerCase();return D.p.filter(p=>(!state.cat||p.c===state.cat)&&(!state.tag||p.g.includes(state.tag))&&matchQ(p,q))}
/* every number shown next to a filter is what that filter would actually return with the other filters applied;
   options that would return nothing are hidden */
function updateCounts(){const q=state.q.trim().toLowerCase();
  const inCat=D.p.filter(p=>(!state.cat||p.c===state.cat)&&matchQ(p,q));
  document.querySelectorAll('#chips .chip').forEach(b=>{const g=+b.dataset.g;const n=g?inCat.filter(p=>p.g.includes(g)).length:inCat.length;
    const sm=b.querySelector('small');if(sm)sm.textContent=n;b.hidden=!!g&&n===0&&state.tag!==g});
  const inTag=D.p.filter(p=>(!state.tag||p.g.includes(state.tag))&&matchQ(p,q));const per={};inTag.forEach(p=>per[p.c]=(per[p.c]||0)+1);
  document.querySelectorAll('#catlist button').forEach(b=>{const c=+b.dataset.c;const n=c?(per[c]||0):inTag.length;b.querySelector('small').textContent=n;b.hidden=!!c&&n===0&&state.cat!==c});
  const m=document.getElementById('mcat');if(m)[...m.options].forEach(o=>{const c=+o.value;const n=c?(per[c]||0):inTag.length;o.textContent=(c?catN(c):t('allCats'))+' ('+n+')';o.hidden=o.disabled=!!c&&n===0&&state.cat!==c})}

    </div>
    <div id="groups"></div><div id="sentinel" style="height:1px"></div>
  </div>
</div></div>`}
function drawProducts(){updateCounts();pList=filtered();pRendered=0;const g=document.getElementById('groups');g.innerHTML='';
  document.getElementById('res').innerHTML=`${I('filter')}<span>${t('showing')} <b class="num">${pList.length}</b> ${t('items')}</span>`;
  document.getElementById('pCount').innerHTML=`<span class="num">${pList.length}</span> ${t('items')}`;
  if(!pList.length){g.innerHTML=`<div class="empty">${I('search')}<p>${t('noRes')}</p></div>`;return}
  more()}
function more(){const g=document.getElementById('groups');if(!g)return;const batch=pList.slice(pRendered,pRendered+48);if(!batch.length)return;
  let html='',last=null;let open=null;
  const gcount=k=>pList.filter(p=>p.c+'|'+sub(p)===k).length;
  batch.forEach(p=>{const k=p.c+'|'+sub(p);if(k!==last){if(open)html+='</div></div>';html+=`<div class="group" data-k="${esc(k)}"><h3>${I('tag')}<span>${esc(sub(p))}</span><small>${gcount(k)} ${t('items')}</small></h3><div class="pgrid">`;open=true;last=k}html+=card(p)});
  if(open)html+='</div></div>';
  const firstK=batch[0].c+'|'+sub(batch[0]);const lg=g.lastElementChild;
  const tmp=document.createElement('div');tmp.innerHTML=html;
  if(lg&&lg.dataset.k===firstK){const fg=tmp.firstElementChild;lg.querySelector('.pgrid').append(...fg.querySelector('.pgrid').children);fg.remove()}
  const added=[...tmp.children];g.append(...added);pRendered+=batch.length;hydrate(g);
  rv([...g.querySelectorAll('.pc:not(.sh)')],.07,0,4);
  g.querySelectorAll('.pc').forEach(c=>c.classList.add('sh'))}
function setFilter(){const ttl=state.cat?catN(state.cat):state.tag?tagN(TAGS.find(g=>g.id===state.tag)):t('nProducts');document.getElementById('pTitle').textContent=ttl;
  const pc=document.getElementById('pCrumb');if(pc)pc.textContent=ttl;
  document.querySelectorAll('#catlist button').forEach(b=>b.classList.toggle('on',+b.dataset.c===state.cat));
  document.querySelectorAll('#chips .chip').forEach(b=>b.classList.toggle('on',+b.dataset.g===state.tag));
  const m=document.getElementById('mcat');if(m)m.value=String(state.cat);
  history.replaceState(null,'',state.cat?'#products-c'+state.cat:state.tag?'#products-t'+state.tag:'#products');drawProducts();
  const top=document.querySelector('.shop').getBoundingClientRect().top+scrollY-90;if(scrollY>top)scrollTo({top,behavior:'smooth'})}
function bindProducts(){
  document.getElementById('catlist').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.cat=+b.dataset.c;setFilter()});
  document.getElementById('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;state.tag=+b.dataset.g;setFilter()});
  document.getElementById('mcat').addEventListener('change',e=>{state.cat=+e.target.value;setFilter()});
  let tmr;document.getElementById('pq').addEventListener('input',e=>{clearTimeout(tmr);tmr=setTimeout(()=>{state.q=e.target.value;drawProducts()},160)});
  drawProducts();
  pObs?.disconnect();pObs=new IntersectionObserver(es=>{if(es[0].isIntersecting)more()},{rootMargin:'900px'});pObs.observe(document.getElementById('sentinel'));
  const on=document.querySelector('#catlist .on');if(on)on.scrollIntoView({block:'nearest'});
}

/* ---------- Motion ---------- */
/* One rule everywhere: content rises and fades in over ~1s as it enters the screen; items of the same group
   follow each other with a short, regular delay; large photos are uncovered by a sliding panel.
   Only opacity and transform move, so it stays smooth on older phones. */
const rvIO=('IntersectionObserver' in window)&&!reduce?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){rvIO.unobserve(e.target);e.target.classList.add('in')}}),{rootMargin:'0px 0px -8% 0px'}):null;
function rv(els,step=.09,base=0,wrap=6){els.forEach((el,i)=>{if(!el)return;el.classList.add('rv');el.style.setProperty('--d',(base+(i%wrap)*step).toFixed(2)+'s');
  el.addEventListener('transitionend',function done(ev){if(ev.target!==el||ev.propertyName!=='transform')return;el.removeEventListener('transitionend',done);el.classList.remove('rv','in');el.style.removeProperty('--d')});
  if(rvIO)rvIO.observe(el);else el.classList.add('in')})}
const $$=q=>[...app.querySelectorAll(q)];let firstView=true;
function countUp(b){const n=+b.dataset.n;if(reduce||!n){b.textContent=n;return}const t0=performance.now(),DUR=1800;
  const f=now=>{const k=Math.min(1,(now-t0)/DUR);b.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
let paraOn=false;
function para(){const im=document.getElementById('paraImg');if(!im)return;const box=im.closest('.made');const r=box.getBoundingClientRect();
  if(r.bottom<0||r.top>innerHeight)return;const p=(r.top+r.height/2-innerHeight/2)/(innerHeight+r.height);im.style.transform=`translate3d(0,${(p*-14).toFixed(2)}%,0) scale(1.06)`}
addEventListener('scroll',()=>{if(paraOn)requestAnimationFrame(para)},{passive:true});
function motion(r){
  /* on the very first visit the hero waits for the logo curtain to lift, so its entrance is actually seen */
  const wait=firstView?Math.max(.15,1.5-performance.now()/1000):.15;
  if(r==='home')rv([...$$('.hero-copy > *'),...$$('.slider')],.13,wait,9);
  firstView=false;
  $$('.pagehead .wrap').forEach(w=>rv([...w.children],.1,.2));
  $$('.sh').forEach(h=>rv([...h.children],.1));
  ['.feat','.mats','#rail','.sectors','.blist','.cgrid','.acc','.figs','.pd-info','.story .txt','.feats','.intro > div:first-child','.net > div:first-child','.cta','.qf','.made .box'].forEach(q=>$$(q).forEach(g=>rv([...g.children].filter(c=>!c.style.getPropertyValue('--d')),.08)));
  rv($$('.mapbox, .pd .gal, .ribbon, .brands, .kicker').filter(e=>!e.style.getPropertyValue('--d')&&!e.closest('.hero')&&!e.closest('.rv')),.1);
  $$('.rv-img').forEach(el=>{if(rvIO)rvIO.observe(el);else el.classList.add('in')});
  const sio=('IntersectionObserver' in window)?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){sio.unobserve(e.target);countUp(e.target)}}),{threshold:.6}):null;
  $$('.figs b[data-n]').forEach(b=>{if(sio&&!reduce){b.textContent='0';sio.observe(b)}else b.textContent=b.dataset.n});
  paraOn=!!document.getElementById('paraImg')&&!reduce;if(paraOn)para();
}
